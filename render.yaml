        fromService:
          type: web
          name: discovery-service
          envVarKey: RENDER_DISCOVERY_URL
      - key: JAVA_OPTS
        value: -Xms128m -Xmx256m
      - key: POSTGRES_DB
        fromDatabase:
          name: flashsale-postgres
          attr: database
      - key: POSTGRES_USER
        fromDatabase:
          name: flashsale-postgres
          attr: username
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: flashsale-postgres
          attr: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: flashsale-postgres
          attr: hostname
      - key: POSTGRES_PORT
        fromDatabase:
          name: flashsale-postgres
          attr: port
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PLATFORM_FEE_PERCENTAGE
        value: "5.0"

  - name: order-service
    owner: {{ .OWNER }}
    region: singapore
    repo: https://github.com/YOUR_GITHUB_USERNAME/stealing-from-paradise.git
    branch: main
