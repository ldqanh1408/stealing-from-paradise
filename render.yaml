        fromService:
          type: web
          name: redis
          envVarKey: REDIS_URL

  # ── Group 3: API Gateway — LAST ─────────────────────────
  - name: api-gateway
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    rootDir: backend/api-gateway
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        fromService:
          type: web
          name: discovery-service
          envVarKey: RENDER_DISCOVERY_URL
      - key: JAVA_OPTS
        value: -Xms128m -Xmx256m

  # ── Self-hosted: Elasticsearch ───────────────────────────
  - name: elasticsearch
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    dockerfilePath: backend/docker/elasticsearch/Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: ELASTICSEARCH_URL
        value: http://localhost:9200
      - key: discovery.type
        value: single-node
      - key: xpack.security.enabled
        value: "false"
      - key: ES_JAVA_OPTS
        value: -Xms256m -Xmx384m

  # ── Self-hosted: Kafka KRaft ─────────────────────────────
  - name: kafka-broker
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    dockerfilePath: backend/docker/kafka/Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: KAFKA_BROKER_URL
        value: localhost:9092
      - key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_AUTO_CREATE_TOPICS_ENABLE
        value: "true"

# ───────────────────────────────────────────────────────────
# MANAGED DATABASES
# ───────────────────────────────────────────────────────────
databases:
  - name: flashsale-postgres
    region: singapore
    plan: starter
    databaseName: flashsale_platform

  - name: flashsale-mongo
    region: singapore
    plan: starter
    databaseName: flashsale_mongo

# ───────────────────────────────────────────────────────────
# MANAGED REDIS
# ───────────────────────────────────────────────────────────
redis:
  - name: redis
    region: singapore
    plan: starter
