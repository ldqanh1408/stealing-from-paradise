      - key: POSTGRES_DB
        fromDatabase:
          name: flashsale-postgres
          attr: database
      - key: POSTGRES_USER
        fromDatabase:
          name: flashsale-postgres
          attr: username
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: flashsale-postgres
          attr: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: flashsale-postgres
          attr: hostname
      - key: POSTGRES_PORT
        fromDatabase:
          name: flashsale-postgres
          attr: port
      - key: AXON_SERVER
        value: axonserver:8124
      - key: KAFKA_SERVER
        fromService:
          type: web
          name: kafka-broker
          envVarKey: KAFKA_BROKER_URL

  - name: flashsale-service
    owner: {{ .OWNER }}
    region: singapore
    repo: https://github.com/YOUR_GITHUB_USERNAME/stealing-from-paradise.git
    branch: main
    rootDir: backend/flashsale-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        fromService:
          type: web
          name: discovery-service
          envVarKey: RENDER_DISCOVERY_URL
      - key: JAVA_OPTS
        value: -Xms128m -Xmx384m
      - key: POSTGRES_DB
        fromDatabase:
          name: flashsale-postgres
          attr: database
      - key: POSTGRES_USER
        fromDatabase:
          name: flashsale-postgres
          attr: username
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: flashsale-postgres
          attr: password
      - key: POSTGRES_HOST
        fromDatabase:
