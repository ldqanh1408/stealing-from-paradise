        fromService:
          type: web
          name: redis
          envVarKey: REDIS_URL

  # ─────────────────────────────────────────────────────
  # GROUP 3 — API GATEWAY (LAST — depends on all above)
  # ─────────────────────────────────────────────────────
  - name: api-gateway
    owner: {{ .OWNER }}
    region: singapore
    repo: https://github.com/YOUR_GITHUB_USERNAME/stealing-from-paradise.git
    branch: main
    rootDir: backend/api-gateway
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        fromService:
          type: web
          name: discovery-service
          envVarKey: RENDER_DISCOVERY_URL
      - key: JAVA_OPTS
        value: -Xms128m -Xmx256m

  # ─────────────────────────────────────────────────────
  # MANAGED DATABASES (created by Render)
  # ─────────────────────────────────────────────────────
  - type: psync
    name: flashsale-postgres
    owner: {{ .OWNER }}
    region: singapore
    plan: starter
    databaseName: flashsale_platform

  - type: psync
    name: flashsale-mongo
    owner: {{ .OWNER }}
    region: singapore
    databaseName: flashsale_mongo

  # ─────────────────────────────────────────────────────
  # MANAGED REDIS (render.com blueprint)
  # ─────────────────────────────────────────────────────
  - type: redis
    name: redis
    owner: {{ .OWNER }}
    region: singapore
    plan: starter

  # ─────────────────────────────────────────────────────
  # SELF-HOSTED ELASTICSEARCH (Docker Web Service)
  # ─────────────────────────────────────────────────────
  - name: elasticsearch
    owner: {{ .OWNER }}
    region: singapore
    repo: https://github.com/YOUR_GITHUB_USERNAME/stealing-from-paradise.git
    branch: main
    dockerfilePath: backend/docker/elasticsearch/Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: ELASTICSEARCH_URL
        value: http://localhost:9200
      - key: discovery.type
        value: single-node
      - key: xpack.security.enabled
        value: "false"
      - key: ES_JAVA_OPTS
        value: -Xms256m -Xmx384m

  # ─────────────────────────────────────────────────────
  # SELF-HOSTED KAFKA (Docker Web Service)
  # ─────────────────────────────────────────────────────
  - name: kafka-broker
    owner: {{ .OWNER }}
    region: singapore
    repo: https://github.com/YOUR_GITHUB_USERNAME/stealing-from-paradise.git
    branch: main
    dockerfilePath: backend/docker/kafka/Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: KAFKA_BROKER_URL
        value: localhost:9092
      - key: KAFKA_ZOOKEEPER_CONNECT
        value: localhost:2181
      - key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_AUTO_CREATE_TOPICS_ENABLE
        value: "true"
