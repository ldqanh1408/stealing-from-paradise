    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        fromService:
          type: web
          name: discovery-service
          envVarKey: RENDER_DISCOVERY_URL
      - key: JAVA_OPTS
        value: -Xms128m -Xmx384m
      - key: POSTGRES_DB
        fromDatabase:
          name: flashsale-postgres
          attr: database
      - key: POSTGRES_USER
        fromDatabase:
          name: flashsale-postgres
          attr: username
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: flashsale-postgres
          attr: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: flashsale-postgres
          attr: hostname
      - key: POSTGRES_PORT
        fromDatabase:
          name: flashsale-postgres
          attr: port

  - name: payment-service
    owner: {{ .OWNER }}
    region: singapore
    repo: https://github.com/YOUR_GITHUB_USERNAME/stealing-from-paradise.git
    branch: main
    rootDir: backend/payment-service
    dockerfilePath: Dockerfile.build
