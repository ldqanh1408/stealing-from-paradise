          envVarKey: RENDER_DISCOVERY_URL
      - key: JAVA_OPTS
        value: -Xms96m -Xmx192m
      - key: MONGO_DB
        fromDatabase:
          type: psync
          name: flashsale-mongo
          attr: database
      - key: MONGO_USERNAME
        fromDatabase:
          type: psync
          name: flashsale-mongo
          attr: username
      - key: MONGO_PASSWORD
        fromDatabase:
          type: psync
          name: flashsale-mongo
          attr: password
      - key: MONGO_HOST
        fromDatabase:
          type: psync
          name: flashsale-mongo
          attr: hostname
      - key: MONGO_PORT
        fromDatabase:
          type: psync
          name: flashsale-mongo
          attr: port
      - key: MAIL_HOST
        value: smtp.sendgrid.net
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: apikey
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: no-reply@yourdomain.com

