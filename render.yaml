# ============================================================
# Render Blueprint — FlashSale Backend
# Deploy: Dashboard > Blueprints > New Blueprint > Apply
# ============================================================

services:
  # Discovery (Eureka)
  - name: discovery-service
    type: web
    runtime: docker
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    rootDir: backend/discovery-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: JAVA_OPTS
        value: -Xms128m -Xmx256m
      - key: RENDER_SERVICE_URL
        value: http://discovery-service:8761

  # Business microservices
  - name: identity-service
    type: web
    runtime: docker
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    rootDir: backend/identity-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        value: http://discovery-service:8761/eureka
      - key: JAVA_OPTS
        value: -Xms128m -Xmx256m
      - key: POSTGRES_HOST
        fromDatabase:
          name: flashsale-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: flashsale-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: flashsale-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: flashsale-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: flashsale-postgres
          property: password
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"

  - name: product-service
    type: web
    runtime: docker
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    rootDir: backend/product-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        value: http://discovery-service:8761/eureka
      - key: JAVA_OPTS
        value: -Xms128m -Xmx384m
      - key: POSTGRES_HOST
        fromDatabase:
          name: flashsale-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: flashsale-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: flashsale-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: flashsale-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: flashsale-postgres
          property: password

  - name: payment-service
    type: web
    runtime: docker
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    rootDir: backend/payment-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        value: http://discovery-service:8761/eureka
      - key: JAVA_OPTS
        value: -Xms128m -Xmx256m
      - key: POSTGRES_HOST
        fromDatabase:
          name: flashsale-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: flashsale-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: flashsale-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: flashsale-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: flashsale-postgres
          property: password
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PLATFORM_FEE_PERCENTAGE
        value: "5.0"

  - name: order-service
    type: web
    runtime: docker
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    rootDir: backend/order-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        value: http://discovery-service:8761/eureka
      - key: JAVA_OPTS
        value: -Xms128m -Xmx384m
      - key: POSTGRES_HOST
        fromDatabase:
          name: flashsale-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: flashsale-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: flashsale-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: flashsale-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: flashsale-postgres
          property: password
      - key: KAFKA_SERVER
        value: kafka-broker:9092

  - name: flashsale-service
    type: web
    runtime: docker
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    rootDir: backend/flashsale-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        value: http://discovery-service:8761/eureka
      - key: JAVA_OPTS
        value: -Xms128m -Xmx384m
      - key: POSTGRES_HOST
        fromDatabase:
          name: flashsale-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: flashsale-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: flashsale-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: flashsale-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: flashsale-postgres
          property: password
      - key: KAFKA_SERVER
        value: kafka-broker:9092

  - name: search-service
    type: web
    runtime: docker
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    rootDir: backend/search-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        value: http://discovery-service:8761/eureka
      - key: JAVA_OPTS
        value: -Xms128m -Xmx384m
      - key: POSTGRES_HOST
        fromDatabase:
          name: flashsale-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: flashsale-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: flashsale-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: flashsale-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: flashsale-postgres
          property: password
      - key: ELASTICSEARCH_URL
        value: http://elasticsearch:9200

  - name: notification-service
    type: web
    runtime: docker
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    rootDir: backend/notification-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        value: http://discovery-service:8761/eureka
      - key: JAVA_OPTS
        value: -Xms96m -Xmx192m
      - key: MONGO_HOST
        value: flashsale-mongo
      - key: MONGO_PORT
        value: "27017"
      - key: MONGO_DB
        value: notification_db
      - key: MONGO_USERNAME
        fromDatabase:
          name: flashsale-mongo
          property: user
      - key: MONGO_PASSWORD
        fromDatabase:
          name: flashsale-mongo
          property: password
      - key: MAIL_HOST
        value: smtp.sendgrid.net
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: apikey
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: no-reply@yourdomain.com

  - name: refund-service
    type: web
    runtime: docker
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    rootDir: backend/refund-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        value: http://discovery-service:8761/eureka
      - key: JAVA_OPTS
        value: -Xms96m -Xmx256m
      - key: POSTGRES_HOST
        fromDatabase:
          name: flashsale-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: flashsale-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: flashsale-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: flashsale-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: flashsale-postgres
          property: password
      - key: STRIPE_SECRET_KEY
        sync: false

  - name: chat-service
    type: web
    runtime: docker
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    rootDir: backend/chat-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        value: http://discovery-service:8761/eureka
      - key: JAVA_OPTS
        value: -Xms128m -Xmx256m
      - key: MONGO_HOST
        value: flashsale-mongo
      - key: MONGO_PORT
        value: "27017"
      - key: MONGO_DB
        value: chat_db
      - key: MONGO_USERNAME
        fromDatabase:
          name: flashsale-mongo
          property: user
      - key: MONGO_PASSWORD
        fromDatabase:
          name: flashsale-mongo
          property: password
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: redis
          property: port

  - name: api-gateway
    type: web
    runtime: docker
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    rootDir: backend/api-gateway
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        value: http://discovery-service:8761/eureka
      - key: JAVA_OPTS
        value: -Xms128m -Xmx256m

  # Redis (Key Value)
  - name: redis
    type: keyvalue
    plan: starter
    region: singapore
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all

  # Self-hosted Kafka KRaft
  - name: kafka-broker
    type: web
    runtime: docker
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    dockerfilePath: backend/docker/kafka/Dockerfile
    plan: starter
    healthCheckPath: /

  # Self-hosted Elasticsearch
  - name: elasticsearch
    type: web
    runtime: docker
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    dockerfilePath: backend/docker/elasticsearch/Dockerfile
    plan: starter
    healthCheckPath: /

databases:
  - name: flashsale-postgres
    plan: starter
    region: singapore
    databaseName: flashsale_platform

  - name: flashsale-mongo
    plan: starter
    region: singapore
    databaseName: flashsale_mongo
