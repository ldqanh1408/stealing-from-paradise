      - key: MONGO_DB
        fromDatabase:
          name: flashsale-mongo
          attr: database
      - key: MONGO_USERNAME
        fromDatabase:
          name: flashsale-mongo
          attr: username
      - key: MONGO_PASSWORD
        fromDatabase:
          name: flashsale-mongo
          attr: password
      - key: MONGO_HOST
        fromDatabase:
          name: flashsale-mongo
          attr: hostname
      - key: MONGO_PORT
        fromDatabase:
          name: flashsale-mongo
          attr: port
