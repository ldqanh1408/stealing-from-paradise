          name: discovery-service
          envVarKey: RENDER_DISCOVERY_URL
      - key: JAVA_OPTS
        value: -Xms128m -Xmx384m
      - key: POSTGRES_DB
        fromDatabase:
          type: psync
          name: flashsale-postgres
          attr: database
      - key: POSTGRES_USER
        fromDatabase:
          type: psync
          name: flashsale-postgres
          attr: username
      - key: POSTGRES_PASSWORD
        fromDatabase:
          type: psync
          name: flashsale-postgres
          attr: password
      - key: POSTGRES_HOST
        fromDatabase:
          type: psync
          name: flashsale-postgres
          attr: hostname
      - key: POSTGRES_PORT
        fromDatabase:
          type: psync
          name: flashsale-postgres
