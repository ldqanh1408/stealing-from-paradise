# ============================================================
# Render Blueprint — FlashSale Backend
# Single file deploys ALL 11 microservices + managed infra.
# Put this at the REPO ROOT (not inside backend/).
#
# IMPORTANT: Deploy in this ORDER:
#   Group 1: discovery-service (Eureka) FIRST
#   Group 2: identity, product, payment, order, flashsale,
#            search, notification, refund, chat (parallel ok)
#   Group 3: api-gateway LAST (depends on all above)
# ============================================================

services:
  # ─────────────────────────────────────────────────────
  # GROUP 1 — MUST DEPLOY FIRST
  # ─────────────────────────────────────────────────────
  - name: discovery-service
    owner: {{ .OWNER }}
    region: singapore
    repo: https://github.com/YOUR_GITHUB_USERNAME/stealing-from-paradise.git
    branch: main
    rootDir: backend/discovery-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: JAVA_OPTS
        value: -Xms128m -Xmx256m

  # ─────────────────────────────────────────────────────
  # GROUP 2 — BUSINESS MICROSERVICES (deploy after discovery)
  # ─────────────────────────────────────────────────────
  - name: identity-service
    owner: {{ .OWNER }}
    region: singapore
    repo: https://github.com/YOUR_GITHUB_USERNAME/stealing-from-paradise.git
    branch: main
    rootDir: backend/identity-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        fromService:
          type: web
          name: discovery-service
          envVarKey: RENDER_DISCOVERY_URL
      - key: JAVA_OPTS
        value: -Xms128m -Xmx256m
      - key: POSTGRES_DB
        fromDatabase:
          name: flashsale-postgres
          attr: database
      - key: POSTGRES_USER
        fromDatabase:
          name: flashsale-postgres
          attr: username
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: flashsale-postgres
          attr: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: flashsale-postgres
          attr: hostname
      - key: POSTGRES_PORT
        fromDatabase:
          name: flashsale-postgres
          attr: port
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"

  - name: product-service
    owner: {{ .OWNER }}
    region: singapore
