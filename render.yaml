        fromDatabase:
          type: psync
          name: flashsale-postgres
          attr: port
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PLATFORM_FEE_PERCENTAGE
        value: "5.0"

