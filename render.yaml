# ============================================================
# Render Blueprint — FlashSale Backend
# Deploy: Dashboard > Blueprints > New Blueprint > Apply
# ============================================================

services:
  # ── Group 1: Discovery (Eureka) — MUST be first ──────────
  - name: discovery-service
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    rootDir: backend/discovery-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: JAVA_OPTS
        value: -Xms128m -Xmx256m

  # ── Group 2: Business Microservices ──────────────────────
  - name: identity-service
    region: singapore
    repo: https://github.com/ldqanh1408/stealing-from-paradise.git
    branch: main
    rootDir: backend/identity-service
    dockerfilePath: Dockerfile.build
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER
        value: "true"
      - key: EUREKA_URI
        fromService:
          type: web
          name: discovery-service
          envVarKey: RENDER_DISCOVERY_URL
      - key: JAVA_OPTS
        value: -Xms128m -Xmx256m
      - key: POSTGRES_DB
        fromDatabase:
          type: psync
          name: flashsale-postgres
          attr: database
      - key: POSTGRES_USER
        fromDatabase:
          type: psync
          name: flashsale-postgres
          attr: username
      - key: POSTGRES_PASSWORD
        fromDatabase:
          type: psync
          name: flashsale-postgres
          attr: password
      - key: POSTGRES_HOST
        fromDatabase:
          type: psync
          name: flashsale-postgres
          attr: hostname
      - key: POSTGRES_PORT
        fromDatabase:
          type: psync
          name: flashsale-postgres
          attr: port
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"

