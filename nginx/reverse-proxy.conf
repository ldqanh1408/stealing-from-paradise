# Nginx Reverse Proxy for FlashSale Platform
# Entry point: all traffic goes here → routes to appropriate service
#
# Routing:
#   /api/v1/* → API Gateway (Spring Boot)
#   /*         → Customer App (default SPA)
#
# Environment variables (with defaults):
#   NGINX_PORT          = 80            (listen port)
#   GATEWAY_HOST        = fs-gateway    (container name)
#   GATEWAY_PORT        = 8080
#   CUSTOMER_HOST        = fs-customer-fe
#   CUSTOMER_PORT       = 3000
#   SELLER_HOST          = fs-seller-fe
#   SELLER_PORT         = 3001
#   ADMIN_HOST           = fs-admin-fe
#   ADMIN_PORT           = 3002

upstream gateway {
    server ${GATEWAY_HOST}:${GATEWAY_PORT};
}

upstream customer-app {
    server ${CUSTOMER_HOST}:${CUSTOMER_PORT};
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

server {
    listen ${NGINX_PORT:-80};
    server_name _;

    # Real IP forwarding (works behind Docker)
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    # ── API Routes → Gateway ──────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://gateway/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass_request_body on;
        proxy_redirect off;
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Customer App (default, catch-all) ─────────────────
    location / {
        limit_req zone=general_limit burst=200 nodelay;

        proxy_pass http://customer-app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ── Health Check ──────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Security Headers ──────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ── Error Pages ───────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        add_header Content-Type text/plain;
        return 503 "Service temporarily unavailable";
    }
}
