# Nginx Reverse Proxy for FlashSale Platform
# Entry point: all traffic goes here → routes to appropriate service
#
# Routing:
#   /api/*  → API Gateway (Spring Boot)
#   /seller/* → Seller App SPA
#   /admin/*  → Admin App SPA
#   /*        → Customer App SPA (default)

# Rate limiting: max 10 req/s per IP, burst of 20 requests
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=20r/s;

upstream gateway {
    server ${GATEWAY_HOST:-fs-gateway}:${GATEWAY_PORT:-8080};
}

upstream customer-app {
    server ${CUSTOMER_HOST:-fs-customer-fe}:${CUSTOMER_PORT:-3000};
}

upstream seller-app {
    server ${SELLER_HOST:-fs-seller-fe}:${SELLER_PORT:-3001};
}

upstream admin-app {
    server ${ADMIN_HOST:-fs-admin-fe}:${ADMIN_PORT:-3002};
}

server {
    listen ${NGINX_PORT:-80};
    server_name _;

    real_ip_header X-Real-IP;
    real_ip_recursive on;

    location /api/ {
        # Rate limiting: 10 requests/second per IP
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://gateway/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass_request_body on;
        proxy_redirect off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /seller/ {
        # Rate limiting: 20 requests/second per IP for frontend
        limit_req zone=frontend_limit burst=40 nodelay;

        proxy_pass http://seller-app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /admin/ {
        # Rate limiting: 20 requests/second per IP for frontend
        limit_req zone=frontend_limit burst=40 nodelay;

        proxy_pass http://admin-app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        # Rate limiting: 20 requests/second per IP for frontend
        limit_req zone=frontend_limit burst=40 nodelay;

        proxy_pass http://customer-app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    error_page 500 502 503 504 @error;
    location @error {
        default_type text/plain;
        return 503 "Service temporarily unavailable";
    }
}
