openapi: "3.0.3"
info:
  title: Product Service - Stock Reservation API
  description: |
    Reserve stock cho 1 variant trong 15 phút khi checkout.
    Đây là REST endpoint song song với Kafka request-reply
    `order.stock_check.request` — dùng khi checkout đồng bộ.
    Base URL: `/api/v1`
    Service: product-service (Port 8090)
  version: "5.4.0"

servers:
  - url: https://api.marketplace.vn/api/v1
    description: Production
  - url: http://localhost:8090/api/v1
    description: Local development

paths:
  /inventory/{variantId}/reserve:
    post:
      operationId: reserveStock
      summary: Reserve stock cho checkout
      description: |
        Tạo bản ghi `stock_reservation` với TTL 15 phút và trừ tạm vào
        `stock_locked` của variant. Nếu đã có reservation cho cùng `session_id`
        thì là idempotent (trả về reservation hiện có).

        Liên quan: UC-PRODUCT-007, BR-PRODUCT-012.

        Lifecycle: pending → confirmed (khi `payment.success`) hoặc released
        (khi `payment.failed` / hết TTL → emit `stock.reservation.expired`).
      tags: [Inventory, StockReservation]
      security:
        - BearerAuth: []
      parameters:
        - name: variantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID variant cần reserve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveStockRequest"
      responses:
        "201":
          description: Đã tạo reservation mới
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "200":
          description: Reservation đã tồn tại (idempotent — trùng session_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "401":
          description: JWT missing/invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Variant không tồn tại hoặc inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Conflict — không đủ stock_available.
            `stock_available = stock_total - stock_locked - stock_flash_reserved`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "INSUFFICIENT_STOCK"
                code: "ERR_PRODUCT_010"
                message: "Yêu cầu 5, chỉ còn 2"
                requested: 5
                available: 2
        "422":
          description: |
            Validation lỗi:
            - quantity < 1 hoặc > 1000
            - session_id sai định dạng

  /inventory/reservations/{reservationId}/release:
    post:
      operationId: releaseReservation
      summary: Giải phóng reservation thủ công
      description: |
        Dùng khi buyer rời khỏi checkout hoặc payment.failed.
        Idempotent — gọi lần thứ 2 trả 200 không thay đổi.
        Emit `stock.reservation.released`.
      tags: [Inventory, StockReservation]
      security:
        - BearerAuth: []
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Đã release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "404":
          description: Reservation không tồn tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ReserveStockRequest:
      type: object
      required: [session_id, quantity]
      properties:
        session_id:
          type: string
          maxLength: 100
          description: Checkout session ID (đến từ order-service)
          example: "chk_2026_05_10_abc123"
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
          example: 2
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 1800
          default: 900
          description: Thời gian giữ chỗ (mặc định 15 phút)

    ReservationResponse:
      type: object
      required:
        - reservation_id
        - variant_id
        - session_id
        - quantity
        - status
        - expires_at
      properties:
        reservation_id:
          type: string
          format: uuid
          example: "11111111-2222-3333-4444-555555555555"
        variant_id:
          type: string
          format: uuid
        session_id:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum: [pending, confirmed, released]
          example: "pending"
        expires_at:
          type: string
          format: date-time
          example: "2026-05-10T10:15:00Z"
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
        requested:
          type: integer
        available:
          type: integer
