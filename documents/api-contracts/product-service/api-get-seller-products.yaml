openapi: "3.0.3"
info:
  title: Product Service - Seller Product Listing
  description: |
    Seller's own product listing endpoint.
    Base URL: `/api/v1`
    Service: product-service (Port 8090)
  version: "5.4.0"

servers:
  - url: https://api.marketplace.vn/api/v1
    description: Production
  - url: http://localhost:8090/api/v1
    description: Local development

paths:
  /sellers/me/products:
    get:
      operationId: getMyProducts
      summary: Lấy danh sách sản phẩm của người bán
      description: |
        Trả về danh sách sản phẩm phân trang của seller hiện tại.
        Bao gồm tất cả trạng thái: active, inactive, out_of_stock, pending.
      tags: [Products]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Số trang (bắt đầu từ 0)
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Số lượng sản phẩm mỗi trang
      responses:
        "200":
          description: Danh sách sản phẩm của seller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProductListResponse"
        "401":
          description: Thiếu JWT hoặc JWT không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Không có quyền SELLER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT từ Identity Service

  schemas:
    SellerProductCard:
      type: object
      required: [product_id, seller_id, name, status, created_at]
      properties:
        product_id:
          type: string
          format: uuid
          example: "507f1f77bcf86cd799439012"
        seller_id:
          type: integer
          format: int64
          example: 42
        name:
          type: string
          maxLength: 200
          example: "Ao Thun Nike Air Nam"
        description:
          type: string
          maxLength: 10000
          description: Rich text/HTML mô tả sản phẩm
          example: "<p>Mo ta san pham...</p>"
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
          example: "Ao Thun Nam"
        category_slug:
          type: string
          example: "ao-thun-nam"
        attributes:
          type: object
          additionalProperties: true
          description: Thuộc tính dạng key-value
          example:
            brand: "Nike"
            material: "100% Cotton"
        images:
          type: array
          items:
            type: string
            format: uri
          description: Danh sách URL hình ảnh
        is_flash:
          type: boolean
          description: Sản phẩm có tham gia flash sale không
          example: false
        status:
          type: string
          enum: [draft, pending, approved, active, inactive, out_of_stock, rejected]
          example: "active"
        reject_reason:
          type: string
          nullable: true
          description: Lý do từ chối (nếu bị rejected)
        stock_available:
          type: integer
          description: Tổng tồn kho khả dụng các variant
          example: 95
        price:
          type: integer
          description: Giá thấp nhất các variant (VND)
          example: 150000
        original_price:
          type: integer
          nullable: true
          description: Giá gốc cao nhất (VND)
          example: 200000
        rating:
          type: number
          format: double
          nullable: true
          example: 4.5
        reviews_count:
          type: integer
          example: 128
        created_at:
          type: string
          format: date-time
          example: "2026-04-14T09:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-04-15T10:00:00Z"

    SellerProductListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SellerProductCard"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Pagination:
      type: object
      required: [page, limit, total, total_pages]
      properties:
        page:
          type: integer
          example: 0
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 45
        total_pages:
          type: integer
          example: 3

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Mã lỗi machine-readable
        message:
          type: string
          description: Thông báo lỗi tiếng Việt
