openapi: "3.0.3"
info:
  title: Identity Service - PUT /users/me
  description: Update current user profile information
  version: "5.4"
servers:
  - url: http://localhost:8081/api/v1
    description: Identity Service (local)
paths:
  /users/me:
    put:
      operationId: updateUserProfile
      summary: Cập nhật thông tin người dùng
      description: >
        Updates the authenticated user's fullName and phone fields.
        All fields are optional; only provided fields are updated.
        Referenced by UC-IDENTITY-003, FR-IDENTITY-008.
      tags:
        - User Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: Updated display name
                phone:
                  type: string
                  description: Vietnamese phone number, must be unique
              example:
                fullName: "Nguyen Van A"
                phone: "0901234567"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
              example:
                userId: 42
                username: "nguyen_van_a"
                email: "a@example.com"
                phone: "0901234567"
                fullName: "Nguyen Van A"
                status: "ACTIVE"
                createdAt: "2024-01-15T08:00:00Z"
                updatedAt: "2026-04-15T10:30:00Z"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: New phone already exists (BR-IDENTITY-001)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserProfileResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        phone:
          type: string
        fullName:
          type: string
        status:
          type: string
          enum: [ACTIVE, LOCKED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        status_code:
          type: integer
