openapi: "3.0.3"
info:
  title: Identity Service - POST /admin/users/{userId}/unlock
  description: Admin unlock a user account
  version: "5.4"
servers:
  - url: http://localhost:8081/api/v1
    description: Identity Service (local)
paths:
  /admin/users/{userId}/unlock:
    post:
      operationId: unlockUser
      summary: Mở khóa tài khoản người dùng
      description: >
        Unlocks a previously locked user account by an admin. Requires ADMIN role.
        Unlocked accounts can authenticate and perform actions normally.
        Referenced by UC-IDENTITY-006, FR-IDENTITY-013, BR-IDENTITY-003.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: User ID to unlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  description: Reason for unlocking the account
              example:
                reason: "Account reviewed, violation resolved"
      responses:
        "200":
          description: User account unlocked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                success: true
                message: "User account unlocked successfully"
        "400":
          description: Validation failure (reason missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden, requires ADMIN role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        status_code:
          type: integer
