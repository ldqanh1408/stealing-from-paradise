version: "3.9"

# Frontend services standalone - Chạy độc lập không phụ thuộc backend
# 3 Vite apps có thể chạy độc lập hoặc cùng nhau

networks:
  flashsale-frontend:
    driver: bridge

services:
  # =================================================================
  # FRONTEND APPLICATIONS (3 Independent Vite Apps)
  # Không phụ thuộc backend - có thể chạy dev server hoặc production
  # =================================================================

  customer-app:
    build:
      context: ./apps/customer
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api/v1}
        - VITE_MOCK_API=${VITE_MOCK_API:-false}
    container_name: frontend-customer
    ports: ["3000:80"]
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api/v1}
      - VITE_MOCK_API=${VITE_MOCK_API:-false}
      - NODE_ENV=${NODE_ENV:-production}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    networks: [flashsale-frontend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Nếu backend không chạy, app sẽ fall back tới mock API
    labels:
      - "description=Customer Portal - Buyer App"
      - "port=3000"

  seller-app:
    build:
      context: ./apps/seller
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api/v1}
        - VITE_MOCK_API=${VITE_MOCK_API:-false}
    container_name: frontend-seller
    ports: ["3001:80"]
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api/v1}
      - VITE_MOCK_API=${VITE_MOCK_API:-false}
      - NODE_ENV=${NODE_ENV:-production}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    networks: [flashsale-frontend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "description=Seller Portal - Shop Management"
      - "port=3001"

  admin-app:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api/v1}
        - VITE_MOCK_API=${VITE_MOCK_API:-false}
    container_name: frontend-admin
    ports: ["3002:80"]
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api/v1}
      - VITE_MOCK_API=${VITE_MOCK_API:-false}
      - NODE_ENV=${NODE_ENV:-production}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    networks: [flashsale-frontend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "description=Admin Portal - Platform Management"
      - "port=3002"

