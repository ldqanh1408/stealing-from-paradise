networks:
  flashsale-net:
    driver: bridge

services:
  # =================================================================
  # FRONTEND APPLICATIONS (3 Independent Vite Apps)
  # =================================================================

  customer-app:
    build:
      context: ./
      dockerfile: apps/customer/Dockerfile
    container_name: fs-customer-fe
    ports: ["3000:80"]
    environment:
      - VITE_API_URL=http://api-gateway:8080/api/v1
      - NODE_ENV=production
    networks: [flashsale-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  seller-app:
    build:
      context: ./
      dockerfile: apps/seller/Dockerfile
    container_name: fs-seller-fe
    ports: ["3001:80"]
    environment:
      - VITE_API_URL=http://api-gateway:8080/api/v1
      - NODE_ENV=production
    networks: [flashsale-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  admin-app:
    build:
      context: ./
      dockerfile: apps/admin/Dockerfile
    container_name: fs-admin-fe
    ports: ["3002:80"]
    environment:
      - VITE_API_URL=http://api-gateway:8080/api/v1
      - NODE_ENV=production
    networks: [flashsale-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s



