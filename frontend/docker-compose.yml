networks:
  flashsale-net:
    driver: bridge

services:
  # =================================================================
  # FRONTEND APPLICATIONS
  # =================================================================
  customer-app:
    build:
      context: ./apps/customer-app
      dockerfile: Dockerfile
    container_name: fs-customer-fe
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    networks: [flashsale-net]

  seller-center:
    build:
      context: ./apps/seller-center
      dockerfile: Dockerfile
    container_name: fs-seller-fe
    ports: ["3001:80"]
    networks: [flashsale-net]

  admin-portal:
    build:
      context: ./apps/admin-portal
      dockerfile: Dockerfile
    container_name: fs-admin-fe
    ports: ["3002:80"]
    networks: [flashsale-net]
