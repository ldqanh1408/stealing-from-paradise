# ============================================================
# FLASH SALE FRONTEND — PRODUCTION OVERRIDE
# ============================================================
# Builds and runs all 3 frontend apps as production nginx containers.
# Each app serves static assets and proxies /api/* to the backend.
#
# USAGE:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# NOTE: Run from the frontend/ directory.
# ============================================================

services:

  customer-app:
    build:
      context: .
      dockerfile: apps/customer/Dockerfile
    container_name: fe-customer
    restart: unless-stopped
    ports: ["${PORT_CUSTOMER:-3000}:80"]
    env_file: .env
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - NODE_ENV=production
    networks: [flashsale-frontend]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  seller-app:
    build:
      context: .
      dockerfile: apps/seller/Dockerfile
    container_name: fe-seller
    restart: unless-stopped
    ports: ["${PORT_SELLER:-3001}:80"]
    env_file: .env
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - NODE_ENV=production
    networks: [flashsale-frontend]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  admin-app:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: fe-admin
    restart: unless-stopped
    ports: ["${PORT_ADMIN:-3002}:80"]
    env_file: .env
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - NODE_ENV=production
    networks: [flashsale-frontend]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
