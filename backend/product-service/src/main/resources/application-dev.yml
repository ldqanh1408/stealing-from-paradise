spring:
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: 27017
    database: ${DB_NAME_PRODUCT:fs_product}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

logging:
  level:
    com.flashsale: DEBUG
    org.springframework.data.mongodb: DEBUG

dev-data:
  enabled: true
  reset: false
