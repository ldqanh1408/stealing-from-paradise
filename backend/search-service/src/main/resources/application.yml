server:
  port: 8091
spring:
  main:
    allow-bean-definition-overriding: true
    lazy-initialization: false
  application:
    name: search-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
  elasticsearch:
    uris: ${ELASTIC_URI:http://localhost:9200}
    socket-keep-alive: true
    socket-timeout: 60000
    repository:
      type: none
  kafka:
    bootstrap-servers: ${KAFKA_SERVER:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ${spring.application.name}-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.flashsale.*
  webflux:
    timeout: 30000

search:
  elasticsearch:
    index-name: skus
    index-alias: skus
    max-result-window: 10000
  kafka:
    product-group: search-service-product-group
    flashsale-group: search-service-flashsale-group
  product-service:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8080}
    timeout-seconds: 30

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 30
    initial-instance-info-replication-interval-seconds: 40
    should-enforce-registration-at-init: false
    fetch-registry: true
    register-with-eureka: true
    enabled: true

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  timeout: 2000ms
