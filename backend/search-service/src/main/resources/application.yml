server:
  port: 8086
spring:
  application:
    name: search-service
  elasticsearch:
    uris: ${ELASTIC_URI:http://localhost:9200}
  kafka:
    bootstrap-servers: ${KAFKA_SERVER:localhost:9092}
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
