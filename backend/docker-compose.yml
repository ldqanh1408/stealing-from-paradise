networks:
  flashsale-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  elastic_data:
  minio_data:
  kafka_data:
  zookeeper_data:
  axon_data:

services:
  # =================================================================
  # 1. INFRASTRUCTURE (HẠ TẦNG DỮ LIỆU & MESSAGE QUEUE)
  # =================================================================
  postgres:
    image: postgres:${POSTGRES_VER:-15.4-alpine}
    container_name: fs-postgres
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [flashsale-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:${MONGO_VER:-6.0.8}
    container_name: fs-mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./backend/docker/mongo/init:/docker-entrypoint-initdb.d:ro
    networks: [flashsale-net]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:${REDIS_VER:-7.2.1-alpine}
    container_name: fs-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [flashsale-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: elasticsearch:${ELASTIC_VER:-8.10.2}
    container_name: fs-elastic
    restart: unless-stopped
    ports: ["9200:9200"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks: [flashsale-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 30s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fs-minio
    restart: unless-stopped
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks: [flashsale-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: fs-zookeeper
    ports: ["2181:2181"]
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes: [zookeeper_data:/var/lib/zookeeper/data]
    networks: [flashsale-net]

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: fs-kafka
    depends_on:
      zookeeper: { condition: service_started }
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 30000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 30000
    volumes: [kafka_data:/var/lib/kafka/data]
    networks: [flashsale-net]
    command: bash -c "sleep 15 && rm -f /var/lib/kafka/data/meta.properties && rm -rf /var/lib/kafka/data/log-* && /etc/confluent/docker/run"

  axonserver:
    image: axoniq/axonserver:latest
    container_name: fs-axon
    ports: ["8024:8024", "8124:8124"]
    environment:
      - AXONIQ_AXONSERVER_CONTEXTS=default
      - AXONIQ_AXONSERVER_STANDALONE=true
      - AXONIQ_AXONSERVER_DEVMODE_ENABLED=true
      - AXONIQ_AXONSERVER_HOSTNAME=axonserver
      - server.servlet.context-path=/
    volumes:
      - ./infra/axon-init:/docker-entrypoint-initdb.d
      - axon_data:/axonserver/data
    networks: [flashsale-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8024/actuator/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # =================================================================
  # 2. RUNNABLE MICROSERVICES (Chỉ lấy các module chạy được)
  # =================================================================

  discovery-service:
    build:
      context: ./backend/discovery-service
      dockerfile: Dockerfile
    container_name: fs-discovery
    ports: ["8761:8761"]
    networks: [flashsale-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8761/actuator/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 150s

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: fs-gateway
    ports: ["8080:8080"]
    environment:
      - EUREKA_URI=${EUREKA_URI}
      - REDIS_HOST=${REDIS_HOST}
    depends_on:
      redis: { condition: service_started }
      discovery-service: { condition: service_started }
    networks: [flashsale-net]

  identity-domain:
    build:
      context: ./backend/identity-service
      dockerfile: Dockerfile
    container_name: fs-identity
    environment:
      - EUREKA_URI=${EUREKA_URI}
      - DB_HOST=${DB_HOST}
      - DB_NAME_IDENTITY=${DB_NAME_IDENTITY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_started }
      discovery-service: { condition: service_started }
    networks: [flashsale-net]

  product-domain:
    build:
      context: ./backend/product-service
      dockerfile: Dockerfile
    container_name: fs-product
    environment:
      - EUREKA_URI=${EUREKA_URI}
      - MONGO_HOST=${MONGO_HOST}
      - DB_NAME_PRODUCT=${DB_NAME_PRODUCT}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD_ENCODED=S3cr3t_M0ng0_P%40ssw0rd%212024
      - KAFKA_SERVER=${KAFKA_SERVER}
      - AXON_SERVER=${AXON_SERVER}
      - MINIO_URL=${MINIO_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    depends_on:
      mongo: { condition: service_started }
      kafka: { condition: service_started }
      axonserver: { condition: service_started }
      discovery-service: { condition: service_started }
    networks: [flashsale-net]

  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: fs-order
    environment:
      - EUREKA_URI=${EUREKA_URI}
      - DB_HOST=${DB_HOST}
      - DB_NAME_ORDER=${DB_NAME_ORDER}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_SERVER=${KAFKA_SERVER}
      - AXON_SERVER=${AXON_SERVER}
    depends_on:
      postgres: { condition: service_started }
      kafka: { condition: service_started }
      axonserver: { condition: service_started }
      discovery-service: { condition: service_started }
    networks: [flashsale-net]

  payment-service:
    build:
      context: ./backend/payment-service
      dockerfile: Dockerfile
    container_name: fs-payment
    environment:
      - EUREKA_URI=${EUREKA_URI}
      - DB_HOST=${DB_HOST}
      - DB_NAME_PAYMENT=${DB_NAME_PAYMENT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - AXON_SERVER=${AXON_SERVER}
    depends_on:
      postgres: { condition: service_started }
      axonserver: { condition: service_started }
      discovery-service: { condition: service_started }
    networks: [flashsale-net]

  flashsale-service:
    build:
      context: ./backend/flashsale-service
      dockerfile: Dockerfile
    container_name: fs-flashsale
    environment:
      - EUREKA_URI=${EUREKA_URI}
      - REDIS_HOST=${REDIS_HOST}
      - KAFKA_SERVER=${KAFKA_SERVER}
      - DB_HOST=${DB_HOST}
      - DB_NAME_FLASHSALE=${DB_NAME_FLASHSALE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - AXON_SERVER=${AXON_SERVER}
    depends_on:
      postgres: { condition: service_started }
      redis: { condition: service_started }
      kafka: { condition: service_started }
      discovery-service: { condition: service_started }
      axonserver: { condition: service_started }
    networks: [flashsale-net]

  search-service:
    build:
      context: ./backend/search-service
      dockerfile: Dockerfile
    container_name: fs-search
    environment:
      - EUREKA_URI=${EUREKA_URI}
      - ELASTIC_URI=http://elasticsearch:9200
      - KAFKA_SERVER=${KAFKA_SERVER}
    depends_on:
      elasticsearch: { condition: service_started }
      kafka: { condition: service_started }
      discovery-service: { condition: service_started }
    networks: [flashsale-net]

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: fs-notification
    environment:
      - EUREKA_URI=${EUREKA_URI}
      - MONGO_HOST=${MONGO_HOST}
      - DB_NAME_NOTIFICATION=${DB_NAME_NOTIFICATION}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD_ENCODED=S3cr3t_M0ng0_P%40ssw0rd%212024
      - REDIS_HOST=${REDIS_HOST}
      - KAFKA_SERVER=${KAFKA_SERVER}
    depends_on:
      mongo: { condition: service_started }
      redis: { condition: service_started }
      kafka: { condition: service_started }
      discovery-service: { condition: service_started }
    networks: [flashsale-net]

  worker-service:
    build:
      context: ./backend/worker-service
      dockerfile: Dockerfile
    container_name: fs-worker
    environment:
      - EUREKA_URI=${EUREKA_URI}
      - DB_HOST=${DB_HOST}
      - DB_NAME_WORKER=${DB_NAME_WORKER}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_SERVER=${KAFKA_SERVER}
      - AXON_SERVER=${AXON_SERVER}
    depends_on:
      postgres: { condition: service_started }
      kafka: { condition: service_started }
      axonserver: { condition: service_started }
      discovery-service: { condition: service_started }
    networks: [flashsale-net]

  cart-service:
    build:
      context: ./backend/cart-service
      dockerfile: Dockerfile
    container_name: fs-cart
    environment:
      - EUREKA_URI=${EUREKA_URI}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis: { condition: service_started }
      discovery-service: { condition: service_started }
    networks: [flashsale-net]

  # =================================================================
  # 3. FRONTEND APPLICATIONS (React + Vite)
  # =================================================================

  customer-app:
    build:
      context: ./frontend
      dockerfile: ./apps/customer/Dockerfile
      args:
        - APP_PATH=apps/customer
    container_name: fs-customer-fe
    ports: ["3000:80"]
    environment:
      - VITE_API_URL=http://api-gateway:8080/api/v1
      - NODE_ENV=production
    depends_on:
      api-gateway: { condition: service_started }
    networks: [flashsale-net]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  seller-app:
    build:
      context: ./frontend
      dockerfile: ./apps/seller/Dockerfile
      args:
        - APP_PATH=apps/seller
    container_name: fs-seller-fe
    ports: ["3001:80"]
    environment:
      - VITE_API_URL=http://api-gateway:8080/api/v1
      - NODE_ENV=production
    depends_on:
      api-gateway: { condition: service_started }
    networks: [flashsale-net]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  admin-app:
    build:
      context: ./frontend
      dockerfile: ./apps/admin/Dockerfile
      args:
        - APP_PATH=apps/admin
    container_name: fs-admin-fe
    ports: ["3002:80"]
    environment:
      - VITE_API_URL=http://api-gateway:8080/api/v1
      - NODE_ENV=production
    depends_on:
      api-gateway: { condition: service_started }
    networks: [flashsale-net]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
