server:
  port: 0
spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: test
  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.cloud.netflix.eureka.EurekaDiscoveryClientConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:flashsale_platform}?currentSchema=orders
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres123!}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    schemas: orders
    default-schema: orders
    create-schemas: true
    clean-disabled: true
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: com.flashsale.commonlib.config.ByteaPostgreSQLDialect
        show_sql: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-group
    producer:
      acks: all
axon:
  axonserver:
    servers: localhost:8124
  serializer:
    general: xstream
eureka:
  client:
    enabled: false
dev-data:
  enabled: false
logging:
  level:
    root: WARN
    com.flashsale: INFO
