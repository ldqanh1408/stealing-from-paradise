server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_BIND:0.0.0.0}
spring:
  main:
    allow-bean-definition-overriding: true  # Cho phép override bean definition (fix WebFlux + Security conflict)
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes: []  # defined in RouteConfig.java
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
jwt:
  secret: ${JWT_SECRET:super_secret_jwt_key_for_flashsale_project_that_is_very_long_32_chars_minimum}
  expiration: ${JWT_EXPIRATION:3600}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,prometheus

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 30
    initial-instance-info-replication-interval-seconds: 40
    should-enforce-registration-at-init: false
    fetch-registry: true
    register-with-eureka: true
    enabled: true
