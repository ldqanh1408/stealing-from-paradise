name: Copilot Setup - Dev Environment

on:
  workflow_dispatch:
    inputs:
      skip_backend:
        description: 'Skip backend setup'
        required: false
        default: false
        type: boolean
      skip_frontend:
        description: 'Skip frontend setup'
        required: false
        default: false
        type: boolean
      skip_docker:
        description: 'Skip Docker validation'
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '22'

jobs:
  # ========================================
  # STEP 0: Detect environment
  # ========================================
  detect-environment:
    name: Detect Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect OS
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "Platform: ${{ runner.arch }}"
          uname -a
          java -version 2>&1 || echo "Java not found"
          node -v 2>/dev/null || echo "Node not found"
          docker --version 2>/dev/null || echo "Docker not found"
          mvn -version 2>/dev/null || echo "Maven not found"

      - name: Project structure check
        run: |
          echo "=== Backend Services ==="
          for svc in discovery-service api-gateway identity-service product-service \
                     order-service payment-service flashsale-service \
                     search-service notification-service chat-service; do
            if [ -f "backend/$svc/pom.xml" ]; then
              echo "  [OK] $svc"
            else
              echo "  [MISSING] backend/$svc/pom.xml"
            fi
          done

          echo ""
          echo "=== Frontend Apps ==="
          for app in customer seller admin; do
            if [ -d "frontend/apps/$app/src" ]; then
              echo "  [OK] $app"
            else
              echo "  [MISSING] frontend/apps/$app/src"
            fi
          done

          echo ""
          echo "=== Docker Compose Files ==="
          for f in docker-compose.yml docker-compose-backend.yml; do
            if [ -f "$f" ]; then
              echo "  [OK] $f"
            else
              echo "  [MISSING] $f"
            fi
          done

  # ========================================
  # STEP 1: Backend Setup
  # ========================================
  setup-backend:
    name: Backend Setup
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_backend != 'true'
    needs: detect-environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Verify Maven wrapper
        working-directory: ./backend
        run: |
          echo "=== Maven Version ==="
          mvn -version

          echo ""
          echo "=== Checking parent POM ==="
          if [ -f pom.xml ]; then
            echo "  [OK] Parent pom.xml found"
            echo "  Project name: $(mvn help:evaluate -Dexpression=project.name -q -DforceStdout 2>/dev/null)"
            echo "  Modules:"
            mvn help:evaluate -Dexpression=project.modules -q -DforceStdout 2>/dev/null | grep -oP '(?<=<module>)[^<]+' | sed 's/^/    - /'
          else
            echo "  [MISSING] pom.xml not found"
            exit 1
          fi

      - name: Download backend dependencies
        working-directory: ./backend
        run: |
          echo "=== Downloading Maven dependencies ==="
          mvn dependency:go-offline -DskipTests -q

      - name: Build backend (skip tests)
        working-directory: ./backend
        run: |
          echo "=== Building backend JARs ==="
          mvn clean package -DskipTests -q
          echo ""
          echo "=== JAR files produced ==="
          find . -name "*.jar" -type f ! -name "*-sources.jar" ! -name "*-javadoc.jar" | sed 's|^|  |'

      - name: List all backend modules
        working-directory: ./backend
        run: |
          echo "=== All Backend Services ==="
          for svc in discovery-service api-gateway identity-service product-service \
                     order-service payment-service flashsale-service \
                     search-service notification-service chat-service; do
            if [ -f "$svc/pom.xml" ]; then
              version=$(mvn help:evaluate -f "$svc/pom.xml" -Dexpression=project.version -q -DforceStdout 2>/dev/null)
              echo "  [OK] $svc  (v$version)"
            else
              echo "  [MISSING] $svc"
            fi
          done

      - name: Upload backend build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-setup-logs
          path: backend/**/target/
          retention-days: 3

  # ========================================
  # STEP 2: Frontend Setup
  # ========================================
  setup-frontend:
    name: Frontend Setup (${{ matrix.app }})
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_frontend != 'true'
    needs: detect-environment

    strategy:
      fail-fast: false
      matrix:
        app: [customer, seller, admin]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/apps/${{ matrix.app }}/package-lock.json

      - name: Check frontend app structure
        working-directory: ./frontend/apps/${{ matrix.app }}
        run: |
          echo "=== Frontend App: ${{ matrix.app }} ==="
          echo "  Package name: $(node -e "console.log(require('./package.json').name)")"
          echo "  Node version: $(node -e "console.log(require('./package.json').engines?.node)")"
          echo "  Scripts:"
          node -e "Object.keys(require('./package.json').scripts || {}).forEach(s => console.log('    - ' + s))"

          echo ""
          echo "  Key files:"
          for f in src/index.tsx src/App.tsx package.json tsconfig.json tailwind.config.js vite.config.ts; do
            if [ -f "$f" ]; then
              echo "    [OK] $f"
            else
              echo "    [MISSING] $f"
            fi
          done

      - name: Install frontend dependencies
        working-directory: ./frontend/apps/${{ matrix.app }}
        run: npm ci

      - name: TypeScript type check
        working-directory: ./frontend/apps/${{ matrix.app }}
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build frontend app
        working-directory: ./frontend/apps/${{ matrix.app }}
        run: npm run build

      - name: Verify build output
        run: |
          dist_dir="frontend/apps/${{ matrix.app }}/dist"
          if [ -d "$dist_dir" ]; then
            echo "  Build output:"
            ls -la "$dist_dir" | head -5
            echo "  [OK] Build successful"
          else
            echo "  [FAIL] dist/ directory not found"
            exit 1
          fi

      - name: Upload frontend build on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.app }}-setup-logs
          path: frontend/apps/${{ matrix.app }}/dist/
          retention-days: 3

  # ========================================
  # STEP 3: Docker Environment Check
  # ========================================
  setup-docker:
    name: Docker Environment Check
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_docker != 'true'
    needs: [setup-backend, setup-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose files
        run: |
          echo "=== Validating Docker Compose files ==="
          for f in docker-compose.yml docker-compose-backend.yml; do
            if [ -f "$f" ]; then
              echo "  [OK] $f"
              services=$(grep -E '^\s+-\s+"fs-' "$f" 2>/dev/null | wc -l || echo "0")
              echo "    Services in $f: $services"
            else
              echo "  [MISSING] $f"
            fi
          done

      - name: Validate backend Dockerfiles
        run: |
          echo "=== Backend Dockerfiles ==="
          for svc in discovery-service api-gateway identity-service product-service \
                     order-service payment-service flashsale-service \
                     search-service notification-service chat-service; do
            for variant in Dockerfile Dockerfile.dev Dockerfile.prod; do
              if [ -f "backend/$svc/$variant" ]; then
                echo "  [OK] $svc/$variant"
                break
              fi
            done
          done

      - name: Validate frontend Dockerfiles
        run: |
          echo "=== Frontend Dockerfiles ==="
          for app in customer seller admin; do
            for variant in Dockerfile Dockerfile.dev Dockerfile.prod; do
              if [ -f "frontend/apps/$app/$variant" ]; then
                echo "  [OK] $app/$variant"
                break
              fi
            done
          done

      - name: Dry-run Docker build - Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/api-gateway/Dockerfile.prod
          push: false
          tags: flashsale-setup-check:latest
          load: true
        continue-on-error: true

      - name: Dry-run Docker build - Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/apps/customer/Dockerfile.prod
          push: false
          tags: flashsale-setup-check:latest
          load: true
        continue-on-error: true

  # ========================================
  # STEP 4: Shared Dependencies Check
  # ========================================
  setup-shared:
    name: Shared Library Check
    runs-on: ubuntu-latest
    needs: [setup-backend, setup-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check shared library
        run: |
          echo "=== Common Library ==="
          if [ -f "backend/common-lib/pom.xml" ]; then
            echo "  [OK] common-lib/pom.xml"
            echo "  Classes:"
            find backend/common-lib/src/main/java -name "*.java" 2>/dev/null | head -10 | sed 's|^|    |'
          else
            echo "  [INFO] common-lib not found"
          fi

          echo ""
          echo "=== Shared Frontend Components ==="
          if [ -d "frontend/shared" ]; then
            echo "  [OK] frontend/shared/"
            find frontend/shared -type f -name "*.ts" -o -name "*.tsx" 2>/dev/null | head -10 | sed 's|^|    |'
          else
            echo "  [INFO] frontend/shared not found"
          fi

      - name: Check environment files
        run: |
          echo "=== Environment Files ==="
          for f in .env.example .env .env.development .env.production; do
            if [ -f "$f" ]; then
              echo "  [OK] $f"
            else
              echo "  [MISSING] $f"
            fi
          done
          echo ""
          echo "  Copy .env.example to .env and update values before running services."

      - name: Check documentation
        run: |
          echo "=== Project Documentation ==="
          for f in RUNNING.md README.md; do
            if [ -f "$f" ]; then
              echo "  [OK] $f"
            else
              echo "  [MISSING] $f"
            fi
          done

  # ========================================
  # STEP 5: Service Ports Summary
  # ========================================
  setup-summary:
    name: Setup Summary
    runs-on: ubuntu-latest
    needs: [setup-docker, setup-shared]
    if: always()

    steps:
      - name: Generate setup summary
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              CO-PILOT DEVELOPMENT ENVIRONMENT SETUP           ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  LOCAL DEVELOPMENT SERVICES                                  ║"
          echo "║                                                              ║"
          echo "║  Backend (run from backend/):                               ║"
          echo "║    mvn clean package -DskipTests                             ║"
          echo "║    mvn spring-boot:run -pl <service>                        ║"
          echo "║                                                              ║"
          echo "║  Frontend (run from frontend/apps/<app>/):                  ║"
          echo "║    npm ci                                                    ║"
          echo "║    npm run dev                                               ║"
          echo "║                                                              ║"
          echo "║  Docker (run from project root):                           ║"
          echo "║    docker compose -f docker-compose.yml up -d                ║"
          echo "║    docker compose -f docker-compose.yml -f \\                 ║"
          echo "║               docker-compose-backend.yml up -d               ║"
          echo "║                                                              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  SERVICE ENDPOINTS (after docker compose up)                 ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  Customer App    http://localhost:3000                       ║"
          echo "║  Seller App      http://localhost:3001                       ║"
          echo "║  Admin App       http://localhost:3002                       ║"
          echo "║  API Gateway     http://localhost:8080                       ║"
          echo "║  Swagger UI      http://localhost:8080/swagger-ui.html       ║"
          echo "║  Eureka          http://localhost:8761                       ║"
          echo "║  Axon Dashboard  http://localhost:8024                      ║"
          echo "║  MinIO Console   http://localhost:9001                       ║"
          echo "║  Kafka UI        http://localhost:8090                       ║"
          echo "║                                                              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  KEY INFRASTRUCTURE                                          ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  PostgreSQL     localhost:5432  (user: flashsale)            ║"
          echo "║  MongoDB        localhost:27017 (user: admin)                ║"
          echo "║  Redis          localhost:6379                               ║"
          echo "║  Elasticsearch  localhost:9200                               ║"
          echo "║  Kafka          localhost:9092                               ║"
          echo "║  MinIO          localhost:9000                               ║"
          echo "║                                                              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  BACKEND SERVICES (Axon-based microservices)                 ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  discovery-service   :8761  (Eureka)                        ║"
          echo "║  api-gateway         :8080  (Spring Cloud Gateway)           ║"
          echo "║  identity-service    :8081  (Auth, JWT, User, Seller)        ║"
          echo "║  product-service     :8082  (Product, Category, Inventory)   ║"
          echo "║  order-service       :8083  (Axon: Order, Cart, Saga)        ║"
          echo "║  payment-service     :8084  (Axon: Payment, Stripe)          ║"
          echo "║  flashsale-service   :8085  (Axon: Flash Sales, Inventory)   ║"
          echo "║  search-service      :8086  (Elasticsearch, product search)   ║"
          echo "║  notification-service:8087  (Email, SMS notifications)       ║"
          echo "║  chat-service        :8093  (AI Chat, OpenAI, human-in-the-loop) ║"
          echo "║                                                              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  QUICK START COMMANDS                                        ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  # Full stack with Docker:                                   ║"
          echo "║  docker compose -f docker-compose.yml \\                       ║"
          echo "║          -f docker-compose-backend.yml up -d                 ║"
          echo "║                                                              ║"
          echo "║  # Backend only (requires local infrastructure):             ║"
          echo "║  cd backend && mvn spring-boot:run -pl api-gateway           ║"
          echo "║                                                              ║"
          echo "║  # Frontend only (requires backend running):                ║"
          echo "║  cd frontend/apps/customer && npm run dev                   ║"
          echo "║                                                              ║"
          echo "║  # Run specific backend service:                             ║"
          echo "║  cd backend && mvn spring-boot:run -pl identity-service      ║"
          echo "║                                                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

      - name: Check job results
        run: |
          echo "=== Setup Results ==="
          echo "  detect-environment: ${{ needs.detect-environment.result }}"
          echo "  setup-backend:       ${{ needs.setup-backend.result }}"
          echo "  setup-frontend:      ${{ needs.setup-frontend.result }}"
          echo "  setup-docker:        ${{ needs.setup-docker.result }}"
          echo "  setup-shared:        ${{ needs.setup-shared.result }}"
          echo ""
          if [[ "${{ needs.setup-backend.result }}" == "success" ]] && \
             [[ "${{ needs.setup-frontend.result }}" == "success" ]]; then
            echo "✅ Development environment is ready!"
          else
            echo "⚠️  Some setup steps failed. Check the logs above."
            echo "   Re-run with specific skip flags if needed."
            exit 1
          fi
