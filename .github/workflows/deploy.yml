name: Build & Deploy (Build on Server)

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  # ========================================
  # QUICK VALIDATION (GitHub Actions)
  # ========================================
  quick-validation:
    name: Quick Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check files exist
        run: |
          echo "✓ Checking backend pom.xml..."
          test -f backend/pom.xml && echo "✓ Found" || exit 1
          
          echo "✓ Checking frontend apps..."
          test -d frontend/apps/customer && echo "✓ Found customer app"
          test -d frontend/apps/seller && echo "✓ Found seller app"
          test -d frontend/apps/admin && echo "✓ Found admin app"
          
          echo "✓ Checking docker-compose.yml..."
          test -f docker-compose.yml && echo "✓ Found"

  # ========================================
  # BUILD & DEPLOY ON SERVER
  # ========================================
  deploy-on-server:
    name: Build & Deploy on Server
    runs-on: ubuntu-latest
    needs: quick-validation
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to server (Build on Host)
        run: |
          # Create comprehensive deployment script
          cat > deploy.sh << 'DEPLOY_EOF'
          #!/bin/bash
          set -e
          
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║           FLASHSALE DEPLOYMENT - BUILD ON SERVER             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          
          # Colors
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m'
          
          log_info() {
              echo -e "${BLUE}[INFO]${NC} $1"
          }
          
          log_success() {
              echo -e "${GREEN}[SUCCESS]${NC} $1"
          }
          
          log_warning() {
              echo -e "${YELLOW}[WARNING]${NC} $1"
          }
          
          log_error() {
              echo -e "${RED}[ERROR]${NC} $1"
          }
          
          PROJECT_DIR="/opt/flashsale"
          
          # ====== STEP 1: INITIALIZE ======
          log_info "Step 1: Initializing deployment..."
          
          if [ ! -d "$PROJECT_DIR" ]; then
            log_error "Project directory does not exist at $PROJECT_DIR"
            echo "Please run: git clone <repo> $PROJECT_DIR"
            exit 1
          fi
          
          cd "$PROJECT_DIR"
          log_success "Project directory ready"
          
          # ====== STEP 2: GIT PULL ======
          log_info "Step 2: Pulling latest code from repository..."
          
          if [ ! -d .git ]; then
            log_error "Not a git repository!"
            exit 1
          fi
          
          git fetch origin
          git reset --hard origin/main
          git clean -fd
          log_success "Code updated"
          
          # ====== STEP 3: SETUP ENVIRONMENT ======
          log_info "Step 3: Setting up environment variables..."
          
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              log_warning "Created .env from .env.example - PLEASE UPDATE WITH YOUR ACTUAL VALUES!"
            else
              log_error ".env.example not found"
              exit 1
            fi
          fi
          
          log_success "Environment ready"
          
          # ====== STEP 4: CHECK PREREQUISITES ======
          log_info "Step 4: Checking prerequisites..."
          
          if ! command -v java &> /dev/null; then
            log_error "Java not found. Install Java 25+"
            exit 1
          fi
          JAVA_VERSION=$(java -version 2>&1 | head -n 1)
          log_success "Java found: $JAVA_VERSION"
          
          if ! command -v mvn &> /dev/null; then
            log_error "Maven not found. Install Maven"
            exit 1
          fi
          log_success "Maven found"
          
          if ! command -v node &> /dev/null; then
            log_error "Node.js not found. Install Node.js 18+"
            exit 1
          fi
          NODE_VERSION=$(node --version)
          log_success "Node.js found: $NODE_VERSION"
          
          if ! command -v npm &> /dev/null; then
            log_error "npm not found"
            exit 1
          fi
          log_success "npm found"
          
          if ! command -v docker &> /dev/null; then
            log_error "Docker not found. Install Docker"
            exit 1
          fi
          log_success "Docker found"
          
          # ====== STEP 5: BUILD BACKEND ======
          log_info "Step 5: Building backend with Maven..."
          
          cd "$PROJECT_DIR/backend"
          log_info "Running: mvn clean package -DskipTests -q"
          mvn clean package -DskipTests -q
          
          log_success "Backend JAR files created in target/ folders"
          cd "$PROJECT_DIR"
          
          # ====== STEP 6: BUILD FRONTEND (optional - for verification) ======
          log_info "Step 6: Building frontend locally for testing (optional)..."
          
          # Frontend will be built inside Docker multi-stage build
          # But we can verify builds locally first
          for app in customer seller admin; do
            log_info "Verifying $app app source files..."
            if [ ! -d "frontend/apps/$app" ]; then
              log_error "$app app directory not found"
              exit 1
            fi
          done
          
          log_success "Frontend apps verified"
          
          # ====== STEP 7: STOP OLD SERVICES ======
          log_info "Step 7: Stopping current services..."
          
          if [ -f docker-compose.yml ]; then
            docker-compose down || true
            log_success "Old services stopped"
          fi
          
          # ====== STEP 8: BUILD DOCKER IMAGES ======
          log_info "Step 8: Building Docker images from compiled artifacts..."
          
          log_info "Building backend service Docker images..."
          log_info "(Docker will COPY pre-built JAR files from target/ folders)"
          
          SERVICES=(
            "discovery-service"
            "api-gateway"
            "identity-service"
            "product-service"
            "order-service"
            "payment-service"
            "cart-service"
            "flashsale-service"
            "search-service"
            "notification-service"
            "worker-service"
          )
          
          for service in "${SERVICES[@]}"; do
            SERVICE_DIR="backend/$service"
            if [ -d "$SERVICE_DIR" ]; then
              # Check if target/ exists (from Maven build)
              if [ ! -d "$SERVICE_DIR/target" ]; then
                log_error "$service target/ not found. Maven build may have failed."
                exit 1
              fi
              
              log_info "Building $service Docker image..."
              # Build from service directory so Dockerfile can COPY target/
              docker build -t flashsale_$service:latest "$SERVICE_DIR"
              log_success "$service image built"
            fi
          done
          
          log_info "Building frontend application Docker images..."
          log_info "(Frontend Docker images use multi-stage build - npm build happens inside Docker)"
          
          for app in customer seller admin; do
            if [ -d "frontend/apps/$app" ]; then
              log_info "Building $app-app Docker image..."
              # Build from frontend root so Dockerfile can COPY apps/$app/**
              docker build -t flashsale_${app}_app:latest \
                -f ./apps/$app/Dockerfile \
                --build-arg APP_PATH=apps/$app \
                ./frontend
              log_success "$app-app image built"
            fi
          done
          
          log_success "All Docker images built successfully"
          
          # ====== STEP 9: START SERVICES ======
          log_info "Step 9: Starting services with docker-compose..."
          
          docker-compose -f docker-compose.yml up -d
          
          log_success "Services started"
          
          # ====== STEP 10: WAIT FOR HEALTH CHECKS ======
          log_info "Step 10: Waiting for services to stabilize (30 seconds)..."
          sleep 30
          
          # ====== STEP 11: VERIFY DEPLOYMENT ======
          log_info "Step 11: Verifying deployment..."
          
          if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
            log_success "✓ API Gateway is healthy"
          else
            log_warning "⚠ API Gateway is still starting..."
          fi
          
          log_info "Running containers:"
          docker-compose ps
          
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                   ✓ DEPLOYMENT COMPLETE                      ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  API Gateway:  http://localhost:8080                         ║"
          echo "║  Customer App: http://localhost:3000                         ║"
          echo "║  Seller App:   http://localhost:3001                         ║"
          echo "║  Admin App:    http://localhost:3002                         ║"
          echo "║  Eureka:       http://localhost:8761                         ║"
          echo "║  Swagger:      http://localhost:8080/swagger-ui.html         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          
          log_success "All services deployed successfully!"
          
          DEPLOY_EOF
          
          chmod +x deploy.sh
          
          # Copy and execute on server
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=10 \
            deploy.sh ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }}:/tmp/deploy.sh
          
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=10 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }} 'bash /tmp/deploy.sh'

      - name: Verify deployment
        run: |
          sleep 5
          echo "🔍 Verifying deployment..."
          if curl -sf http://${{ secrets.SERVER_IP }}:8080/actuator/health > /dev/null 2>&1; then
            echo "✓ API Gateway is responding"
          else
            echo "⚠ API Gateway may still be starting, check server logs"
          fi

      - name: Show deployment info
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "                    📋 DEPLOYMENT INFORMATION"
          echo "═══════════════════════════════════════════════════════════════"
          echo "Server:    ${{ secrets.SERVER_IP }}"
          echo "Branch:    ${{ github.ref_name }}"
          echo "Commit:    ${{ github.sha }}"
          echo ""
          echo "🌐 Access Applications:"
          echo "   • API Gateway: http://${{ secrets.SERVER_IP }}:8080"
          echo "   • Customer:    http://${{ secrets.SERVER_IP }}:3000"
          echo "   • Seller:      http://${{ secrets.SERVER_IP }}:3001"
          echo "   • Admin:       http://${{ secrets.SERVER_IP }}:3002"
          echo "   • Eureka:      http://${{ secrets.SERVER_IP }}:8761"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

  # ========================================
  # NOTIFICATION
  # ========================================
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: deploy-on-server
    if: always()

    steps:
      - name: Deployment Result
        run: |
          echo ""
          if [ "${{ needs.deploy-on-server.result }}" == "success" ]; then
            echo "✅ ✅ ✅ DEPLOYMENT SUCCESSFUL ✅ ✅ ✅"
            echo ""
            echo "Server: ${{ secrets.SERVER_IP }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo "🚀 All services are now running on the server!"
          else
            echo "❌ ❌ ❌ DEPLOYMENT FAILED ❌ ❌ ❌"
            echo ""
            echo "Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "SSH to server and check logs:"
            echo "  ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }}"
            echo "  cd /opt/flashsale && docker-compose logs"
          fi
          echo ""





