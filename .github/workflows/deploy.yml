name: CD — Deploy to Production

on:
  # Triggered when a PR is merged (closed with merged=true)
  pull_request:
    types: [closed]
    branches:
      - main
  # Triggered on direct push to main (e.g. bypassing PR, hotfix)
  push:
    branches:
      - main
  # Manual trigger
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'main'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/flashsale

jobs:
  # ─────────────────────────────────────────────
  # 0. Gate: skip non-merge PR closes
  # ─────────────────────────────────────────────
  gate:
    name: Gate Check
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" == "closed" ]]; then
            if [[ "${{ github.event.pull_request.merged }}" != "true" ]]; then
              echo "should_run=false" >> $GITHUB_OUTPUT
              echo "reason=PR closed without merge — skipping CD"
            else
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "reason=PR merged to main — proceeding with CD"
            fi
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "reason=Push to main or manual dispatch — proceeding with CD"
          fi

  # ─────────────────────────────────────────────
  # 1a. Pre-Build: Backend JARs (build on host, pass into container)
  # ─────────────────────────────────────────────
  build-backend-artifacts:
    name: Build Backend Artifacts
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_run == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build all backend JARs
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Upload api-gateway JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-api-gateway
          path: backend/api-gateway/target/*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload discovery-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-discovery-service
          path: backend/discovery-service/target/*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload identity-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-identity-service
          path: backend/identity-service/target/*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload product-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-product-service
          path: backend/product-service/target/*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload order-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-order-service
          path: backend/order-service/target/*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload payment-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-payment-service
          path: backend/payment-service/target/*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload flashsale-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-flashsale-service
          path: backend/flashsale-service/target/*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload search-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-search-service
          path: backend/search-service/target/*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload notification-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-notification-service
          path: backend/notification-service/target/*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload worker-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-worker-service
          path: backend/worker-service/target/*.jar
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # 1b. Pre-Build: Frontend apps with dependencies
  # ─────────────────────────────────────────────
  build-frontend-artifacts:
    name: Build Frontend Artifacts
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: [customer, seller, admin]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/apps/${{ matrix.app }}/package-lock.json

      - name: Build frontend app
        working-directory: ./frontend/apps/${{ matrix.app }}
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: npm ci && npm run build

      - name: Upload frontend app
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app-${{ matrix.app }}
          path: frontend/apps/${{ matrix.app }}
          retention-days: 1

  # ─────────────────────────────────────────────
  # 2. Build all Dockerfile.dev with pre-built artifacts (parallel matrix)
  # ─────────────────────────────────────────────
  build-prod:
    name: Prod - Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [build-backend-artifacts, build-frontend-artifacts]
    if: needs.gate.outputs.should_run == 'true'

    strategy:
      fail-fast: false
      matrix:
        service: [
          api-gateway,
          discovery-service,
          identity-service,
          product-service,
          order-service,
          payment-service,
          flashsale-service,
          search-service,
          notification-service,
          worker-service,
          customer-app,
          seller-app,
          admin-app,
          reverse-proxy,
        ]

    steps:
      - uses: actions/checkout@v4

      # ── Download & place backend JAR ──
      - name: Download backend JAR
        if: contains(matrix.service, '-service') || matrix.service == 'api-gateway' || matrix.service == 'discovery-service'
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: /tmp/backend-jars

      - name: Copy backend JAR into Docker context
        if: contains(matrix.service, '-service') || matrix.service == 'api-gateway' || matrix.service == 'discovery-service'
        run: |
          FOUND_JAR="$(find /tmp/backend-jars -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)"
          if [ -z "$FOUND_JAR" ]; then
            echo "ERROR: No JAR found for ${{ matrix.service }}"
            exit 1
          fi
          DEST_DIR="backend/${{ matrix.service }}/target"
          mkdir -p "$DEST_DIR"
          cp "$FOUND_JAR" "$DEST_DIR/"
          echo "Copied JAR to $DEST_DIR"

      # ── Download & place frontend app ──
      - name: Download frontend app artifact
        if: contains(matrix.service, '-app')
        uses: actions/download-artifact@v4
        with:
          name: >-
            frontend-app-${{ matrix.service == 'customer-app' && 'customer' || matrix.service == 'seller-app' && 'seller' || 'admin' }}
          path: >-
            ./frontend/apps/${{ matrix.service == 'customer-app' && 'customer' || matrix.service == 'seller-app' && 'seller' || 'admin' }}

      # ── Docker setup ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Determine context and Dockerfile ──
      - name: Determine context and dockerfile
        id: ctx
        run: |
          case "${{ matrix.service }}" in
            api-gateway|discovery-service|identity-service|product-service|order-service|payment-service|flashsale-service|search-service|notification-service|worker-service)
              echo "context=./backend/${{ matrix.service }}" >> $GITHUB_OUTPUT
              echo "file=./backend/${{ matrix.service }}/Dockerfile.prod" >> $GITHUB_OUTPUT
              echo "image_name=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}" >> $GITHUB_OUTPUT
              ;;
            customer-app)
              echo "context=./frontend/apps/customer" >> $GITHUB_OUTPUT
              echo "file=./frontend/apps/customer/Dockerfile.prod" >> $GITHUB_OUTPUT
              echo "image_name=${{ env.IMAGE_PREFIX }}-customer-app" >> $GITHUB_OUTPUT
              ;;
            seller-app)
              echo "context=./frontend/apps/seller" >> $GITHUB_OUTPUT
              echo "file=./frontend/apps/seller/Dockerfile.prod" >> $GITHUB_OUTPUT
              echo "image_name=${{ env.IMAGE_PREFIX }}-seller-app" >> $GITHUB_OUTPUT
              ;;
            admin-app)
              echo "context=./frontend/apps/admin" >> $GITHUB_OUTPUT
              echo "file=./frontend/apps/admin/Dockerfile.prod" >> $GITHUB_OUTPUT
              echo "image_name=${{ env.IMAGE_PREFIX }}-admin-app" >> $GITHUB_OUTPUT
              ;;
            reverse-proxy)
              echo "context=./nginx" >> $GITHUB_OUTPUT
              echo "file=./nginx/Dockerfile" >> $GITHUB_OUTPUT
              echo "image_name=${{ env.IMAGE_PREFIX }}-reverse-proxy" >> $GITHUB_OUTPUT
              ;;
          esac

      # ── Build and push Prod image ──
      - name: Build and push Prod image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ctx.outputs.image_name }}:prod-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.ctx.outputs.image_name }}:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # 3. Deploy to Server — pull images and start
  # ─────────────────────────────────────────────
  deploy-server:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-prod, gate]
    if: needs.gate.outputs.should_run == 'true'
    concurrency:
      group: deploy-server
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            docker-compose.prod-pulled.yml
            nginx/
            .env.example
            backend/docker/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Set image tag
        id: meta
        run: |
          echo "tag=prod-latest" >> $GITHUB_OUTPUT

      - name: Install SSH key
        env:
          _USER: ${{ secrets.DEPLOY_USER }}
          _IP: ${{ secrets.SERVER_IP }}
          _KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$_USER" ] || [ -z "$_IP" ] || [ -z "$_KEY" ]; then
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
            echo "SKIP_REASON=Missing secrets (DEPLOY_USER, SERVER_IP, or SSH_PRIVATE_KEY)" >> $GITHUB_ENV
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$_KEY" > ~/.ssh/id_rsa
          sed -i 's/\r$//' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Debug SSH Connection
        if: env.SKIP_DEPLOY != 'true'
        env:
          _USER: ${{ secrets.DEPLOY_USER }}
          _IP: ${{ secrets.SERVER_IP }}
        run: |
          SERVER="${_USER}@${_IP}"
          echo "Testing SSH to ${SERVER}..."
          ssh -o StrictHostKeyChecking=no \
             -o UserKnownHostsFile=~/.ssh/known_hosts \
             -o ConnectTimeout=15 \
             "${SERVER}" "echo 'SSH OK' && uname -a"

      - name: Deploy to server
        if: env.SKIP_DEPLOY != 'true'
        env:
          _USER: ${{ secrets.DEPLOY_USER }}
          _IP: ${{ secrets.SERVER_IP }}
          IMAGE_TAG: prod-latest
          IMAGE_PREFIX: ${{ github.repository_owner }}/flashsale
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET_PROD: ${{ secrets.STRIPE_WEBHOOK_SECRET_PROD }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          SERVER="${_USER}@${_IP}"
          echo "═══════════════════════════════════════════════════"
          echo "  Deploying to ${SERVER}"
          echo "  Tag: ${IMAGE_TAG}"
          echo "  Registry: ${REGISTRY}"
          echo "═══════════════════════════════════════════════════"

          cat > /tmp/deploy.sh << 'DEPLOY_EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          RED='\033[0;31m'; GREEN='\033[0;32m'; YELLOW='\033[1;33m'
          BLUE='\033[0;34m'; NC='\033[0m'

          log_info() { echo -e "${BLUE}[INFO]${NC}  $*"; }
          log_ok()   { echo -e "${GREEN}[OK]${NC}   $*"; }
          log_warn() { echo -e "${YELLOW}[WARN]${NC} $*" >&2; }
          log_err()  { echo -e "${RED}[ERR]${NC}  $*" >&2; exit 1; }

          IMAGE_TAG="${1}"; IMAGE_PREFIX="${2}"; REGISTRY="${3}"; SERVER_IP="${4}"
          PROJECT_DIR="/opt/flashsale"

          # Secrets injected as environment variables by GitHub Actions
          JWT_SECRET="${JWT_SECRET:-}"
          REDIS_PASSWORD="${REDIS_PASSWORD:-}"
          POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-}"
          MONGO_INITDB_ROOT_PASSWORD="${MONGO_INITDB_ROOT_PASSWORD:-}"
          MINIO_ACCESS_KEY="${MINIO_ACCESS_KEY:-}"
          MINIO_SECRET_KEY="${MINIO_SECRET_KEY:-}"
          STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY:-}"
          STRIPE_WEBHOOK_SECRET_PROD="${STRIPE_WEBHOOK_SECRET_PROD:-}"
          VITE_STRIPE_PUBLISHABLE_KEY="${VITE_STRIPE_PUBLISHABLE_KEY:-}"
          STRIPE_PUBLISHABLE_KEY="${STRIPE_PUBLISHABLE_KEY:-}"
          MAIL_PASSWORD="${MAIL_PASSWORD:-}"
          MAIL_FROM="no-reply@flashsale.com"

          log_info "Starting server deployment"
          log_info "Image tag: ${IMAGE_TAG}"

          # Step 1: Login to GHCR
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            log_info "Logging into ${REGISTRY}..."
            echo "${GITHUB_TOKEN}" | docker login "${REGISTRY}" -u USERNAME --password-stdin
            log_ok "Registry login OK"
          fi

          # Step 2: Write .env.production with secrets (gitignored)
          log_info "Writing production .env file..."
          cat > "${PROJECT_DIR}/.env.production" << ENVEOF
          # ============================================================
          # PRODUCTION ENVIRONMENT — AUTO-GENERATED BY DEPLOY.YML
          # ============================================================
          # DO NOT COMMIT THIS FILE TO GIT
          # ============================================================

          # ---- [A] VERSION PINNING ----
          COMPOSE_PROJECT_NAME=flashsale
          TZ=Asia/Ho_Chi_Minh
          POSTGRES_VER=15.4-alpine
          MONGO_VER=6.0.8
          REDIS_VER=7.2.1-alpine
          KAFKA_VER=7.4.0
          ELASTIC_VER=8.10.2
          AXON_VER=latest

          # ---- [B] SPRING PROFILE ----
          SPRING_PROFILES_ACTIVE=prod

          # ---- [D] JWT ----
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRATION_MS=86400000
          JWT_REFRESH_EXPIRATION_MS=604800000

          # ---- [D] PostgreSQL ----
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

          # ---- [D] MongoDB ----
          MONGO_INITDB_ROOT_USERNAME=fs_mongo_admin
          MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

          # ---- [D] Redis ----
          REDIS_PASSWORD=${REDIS_PASSWORD}

          # ---- [D] MinIO ----
          MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
          MINIO_SECRET_KEY=${MINIO_SECRET_KEY}

          # ---- [E] Database names ----
          DB_NAME=flashsale_platform
          DB_NAME_PRODUCT=fs_product
          DB_NAME_NOTIFICATION=fs_notification

          # ---- [F] Infrastructure routing ----
          DB_HOST=postgres
          MONGO_HOST=mongo
          REDIS_HOST=redis
          KAFKA_SERVER=kafka:29092
          AXON_SERVER=axonserver:8124
          ELASTIC_URI=http://elasticsearch:9200
          MINIO_URL=http://minio:9000
          EUREKA_URI=http://discovery-service:8761/eureka/

          # ---- [G] Stripe ----
          STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
          VITE_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET_PROD}
          STRIPE_PLATFORM_FEE_PERCENTAGE=5.0

          # ---- [G] Email ----
          MAIL_HOST=smtp.sendgrid.net
          MAIL_PORT=587
          MAIL_USERNAME=apikey
          MAIL_PASSWORD=${MAIL_PASSWORD}
          MAIL_FROM=no-reply@flashsale.com

          # ---- [H] JVM / resource tuning ----
          ES_JAVA_OPTS=-Xms512m -Xmx512m
          JVM_OPTS_COMMON=-Xms256m -Xmx512m -XX:+UseG1GC
          JVM_OPTS_GATEWAY=-Xms512m -Xmx512m -XX:+UseG1GC
          JVM_OPTS_IDENTITY=-Xms256m -Xmx512m -XX:+UseG1GC
          JVM_OPTS_PAYMENT=-Xms512m -Xmx512m -XX:+UseG1GC --enable-native-access=ALL-UNNAMED
          JVM_OPTS_ORDER=-Xms512m -Xmx1g -XX:+UseG1GC --enable-native-access=ALL-UNNAMED
          JVM_OPTS_FLASHSALE=-Xms1g -Xmx1g -XX:+UseG1GC --enable-native-access=ALL-UNNAMED
          JVM_OPTS_PRODUCT=-Xms512m -Xmx1g -XX:+UseG1GC
          JVM_OPTS_SEARCH=-Xms512m -Xmx1g -XX:+UseG1GC
          JVM_OPTS_NOTIFICATION=-Xms256m -Xmx512m -XX:+UseG1GC
          JVM_OPTS_WORKER=-Xms512m -Xmx1g -XX:+UseG1GC

          # ---- [I] Frontend ----
          # Browser sends /api/v1/... → reverse-proxy/per-app nginx forwards
          # as-is to gateway → gateway matches /api/v1/** routes.
          VITE_API_URL=/api/v1
          NEXT_PUBLIC_API_URL=/api/v1
          NEXT_PUBLIC_WS_URL=/ws/user

          ENVEOF
          log_ok "Production .env written with secrets"

          # Also write a .env file for docker-compose ${} interpolation.
          # Docker Compose reads .env at the project root for variable substitution.
          # .env.production already has all non-secret vars, so just copy it.
          log_info "Writing .env (copying from .env.production for docker-compose interpolation)..."
          cp "${PROJECT_DIR}/.env.production" "${PROJECT_DIR}/.env"
          log_ok ".env written for docker-compose interpolation"

          # Step 3: Release port 8080, then remove all old containers
          log_info "Releasing port 8080 before teardown..."
          sudo apt-get install -y psmisc lsof 2>/dev/null || true

          # 3a. Stage 1 — neutralize restart policy on fs-gateway so the daemon
          #     cannot resurrect it mid-cleanup (race with `restart: unless-stopped`)
          docker update --restart=no fs-gateway 2>/dev/null || true

          # 3b. Stage 2 — sweep ANY container (running or stopped) that reserves
          #     host port 8080 in HostConfig.PortBindings. Match BOTH forms:
          #     - "8080/tcp" key (when container port == host port)
          #     - "HostPort":"8080" value (when a different container port maps to host 8080)
          docker ps -aq 2>/dev/null | while read cid; do
            bindings=$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$cid" 2>/dev/null)
            if echo "$bindings" | grep -qE '"8080/tcp"|"HostPort":"8080"'; then
              name=$(docker inspect --format '{{.Name}}' "$cid" 2>/dev/null)
              image=$(docker inspect --format '{{.Config.Image}}' "$cid" 2>/dev/null)
              log_warn "Found container $name (image=$image, id=$cid) reserving host port 8080 — force-removing"
              log_warn "  PortBindings: $bindings"
              docker rm -f "$cid" 2>/dev/null || true
            fi
          done

          # 3c. Disconnect fs-gateway from all Docker networks (clears internal endpoint DB)
          docker network ls --quiet 2>/dev/null | while read net_id; do
            docker network disconnect --force "$net_id" fs-gateway 2>/dev/null || true
          done
          # 3d. Stop and remove the gateway container (idempotent — likely already gone via 3b)
          docker stop fs-gateway 2>/dev/null || true
          docker rm -f fs-gateway 2>/dev/null || true
          # 3e. Kill ALL docker-proxy processes (any one of them could own the port binding)
          sudo pkill -9 -f "docker-proxy" 2>/dev/null || true
          # 3f. Kill whatever else is on 8080 by PID
          sudo lsof -t -i :8080 2>/dev/null | xargs -r sudo kill -9 2>/dev/null || true
          sleep 2

          log_info "Removing remaining containers..."
          cd "${PROJECT_DIR}"
          docker-compose -f docker-compose.yml -f docker-compose.prod-pulled.yml down --remove-orphans 2>/dev/null || true
          docker ps -aq --filter "name=fs-" 2>/dev/null | xargs -r docker rm -f 2>/dev/null || true
          docker network ls --format '{{.Name}}' | grep -E '^(flashsale|flashsale_prod)' | xargs -r docker network rm 2>/dev/null || true
          docker network prune -f 2>/dev/null || true
          # Remove old images
          docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'ghcr.io.*:(prod-latest|prod-[0-9]' | xargs -r docker rmi -f 2>/dev/null || true
          log_ok "Old containers and images removed"

          # Step 4: Hard gate — verifies BOTH the OS layer (lsof/ss) AND Docker's
          # internal port-reservation table. This is the key change: previous
          # versions only checked the OS, but Docker can refuse `up` because of
          # a stopped-container record even when the OS port is free.
          log_info "Verifying port 8080 is free at OS and Docker level (blocking gate)..."
          port_free=0
          for attempt in $(seq 1 10); do
            os_busy=0; docker_busy=0
            if sudo lsof -i :8080 >/dev/null 2>&1 || sudo ss -tlnp 2>/dev/null | grep -q ':8080 '; then
              os_busy=1
            fi
            if docker ps -aq 2>/dev/null | xargs -r -I{} docker inspect --format '{{json .HostConfig.PortBindings}}' {} 2>/dev/null | grep -qE '"8080/tcp"|"HostPort":"8080"'; then
              docker_busy=1
            fi
            if [ "$os_busy" -eq 0 ] && [ "$docker_busy" -eq 0 ]; then
              port_free=1
              log_ok "Port 8080 is free at OS and Docker level (attempt ${attempt})"
              break
            fi
            log_warn "Port 8080 still reserved (os=${os_busy} docker=${docker_busy}) — re-sweeping (attempt ${attempt}/10)..."
            # Re-run the container sweep
            docker ps -aq 2>/dev/null | while read cid; do
              docker inspect --format '{{json .HostConfig.PortBindings}}' "$cid" 2>/dev/null | grep -qE '"8080/tcp"|"HostPort":"8080"' && docker rm -f "$cid" 2>/dev/null || true
            done
            sudo fuser -k -9 8080/tcp 2>/dev/null || true
            sudo pkill -9 -f "docker-proxy" 2>/dev/null || true
            sudo lsof -t -i :8080 2>/dev/null | xargs -r sudo kill -9 2>/dev/null || true
            sleep 3
          done
          if [ "$port_free" -eq 0 ]; then
            log_err "FATAL: Port 8080 reservations could not be cleared. Diagnostic dump:"
            echo '--- docker ps -a ---'
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
            echo '--- ss -tlnp :8080 ---'
            sudo ss -tlnp | grep ':8080' || true
            echo '--- lsof -i :8080 ---'
            sudo lsof -i :8080 || true
            exit 1
          fi

          # Step 5: Pull all images (export vars so docker-compose can interpolate ${IMAGE_PREFIX})
          export IMAGE_PREFIX COMPOSE_PROJECT_NAME TZ POSTGRES_VER MONGO_VER REDIS_VER KAFKA_VER \
                 ELASTIC_VER AXON_VER SPRING_PROFILES_ACTIVE \
                 JWT_EXPIRATION_MS JWT_REFRESH_EXPIRATION_MS \
                 DB_NAME DB_HOST DB_NAME_PRODUCT DB_NAME_NOTIFICATION \
                 MONGO_HOST REDIS_HOST KAFKA_SERVER AXON_SERVER \
                 ELASTIC_URI MINIO_URL EUREKA_URI \
                 STRIPE_PLATFORM_FEE_PERCENTAGE \
                 MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_FROM \
                 ES_JAVA_OPTS \
                 JVM_OPTS_COMMON JVM_OPTS_GATEWAY JVM_OPTS_IDENTITY \
                 JVM_OPTS_PAYMENT JVM_OPTS_ORDER JVM_OPTS_FLASHSALE \
                 JVM_OPTS_PRODUCT JVM_OPTS_SEARCH JVM_OPTS_NOTIFICATION JVM_OPTS_WORKER \
                 VITE_API_URL NEXT_PUBLIC_API_URL NEXT_PUBLIC_WS_URL
          log_info "Pulling all images..."
          docker-compose -f docker-compose.yml -f docker-compose.prod-pulled.yml pull
          log_ok "Images pulled"

          # Step 5b: Moment-of-truth diagnostic + last-second sweep.
          # Step 4 passed earlier, but `pull` and other daemon activity have run
          # since. Print exact host state right NOW so the next failure log shows
          # the offender, then sweep one more time as a backstop.
          log_info "Pre-up diagnostic — host state immediately before docker-compose up:"
          echo '--- All containers (docker ps -a) ---'
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}' || true
          echo '--- Listeners on :8080 (ss -tlnp) ---'
          sudo ss -tlnp 2>/dev/null | grep ':8080' || echo '(no listeners on :8080)'
          echo '--- Containers reserving host port 8080 ---'
          docker ps -aq 2>/dev/null | while read cid; do
            pb=$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$cid" 2>/dev/null)
            if echo "$pb" | grep -qE '"8080/tcp"|"HostPort":"8080"'; then
              echo "  $(docker inspect --format '{{.Name}} (image={{.Config.Image}}, status={{.State.Status}})' "$cid"): $pb"
            fi
          done | tee /tmp/pre_up_8080.txt
          echo '--- End diagnostic ---'

          log_info "Last-second sweep before docker-compose up..."
          swept=0
          docker ps -aq 2>/dev/null | while read cid; do
            pb=$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$cid" 2>/dev/null)
            if echo "$pb" | grep -qE '"8080/tcp"|"HostPort":"8080"'; then
              name=$(docker inspect --format '{{.Name}}' "$cid" 2>/dev/null)
              log_warn "LAST-SECOND: removing $name ($cid) which reserves port 8080"
              docker rm -f "$cid" 2>/dev/null || true
              swept=$((swept + 1))
            fi
          done
          sudo pkill -9 -f "docker-proxy" 2>/dev/null || true
          sudo lsof -t -i :8080 2>/dev/null | xargs -r sudo kill -9 2>/dev/null || true
          sleep 2

          # Step 6: Start services
          # Non-secret vars are already exported above (Step 5). IMAGE_PREFIX is always
          # exported. Secrets are injected via .env.production env_file for containers.
          log_info "Starting services..."
          cd "${PROJECT_DIR}"
          docker-compose -f docker-compose.yml -f docker-compose.prod-pulled.yml --env-file "${PROJECT_DIR}/.env.production" up -d
          log_ok "Services started"

          # Step 6b: Force reverse-proxy restart to ensure new nginx image is loaded
          log_info "Restarting reverse-proxy with new nginx image..."
          docker-compose -f docker-compose.yml -f docker-compose.prod-pulled.yml restart reverse-proxy 2>/dev/null || true
          sleep 5
          log_ok "Reverse-proxy restarted (nginx config refreshed)"

          # Step 7: Health check
          log_info "Waiting for services to stabilize (60s)..."
          sleep 60
          echo 'Running containers:'
          docker-compose -f docker-compose.yml -f docker-compose.prod-pulled.yml ps
          echo ''
          echo 'Health checks:'
          docker-compose -f docker-compose.yml -f docker-compose.prod-pulled.yml exec -T redis redis-cli ping > /dev/null 2>&1 && echo '[OK] Redis' || echo '[!!] Redis not ready'
          curl -sf http://localhost:8761/actuator/health > /dev/null 2>&1 && echo '[OK] Eureka' || echo '[!!] Eureka not ready'
          docker-compose -f docker-compose.yml -f docker-compose.prod-pulled.yml exec -T fs-gateway curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1 && echo '[OK] API Gateway' || echo '[!!] API Gateway not ready'
          log_ok "Health check complete"

          # Step 7: Summary
          echo ''
          echo '╔══════════════════════════════════════════════════════════╗'
          echo '║          ✓  DEPLOYMENT SUCCESSFUL                    ║'
          echo '╠══════════════════════════════════════════════════════════╣'
          echo "║  Tag:       ${IMAGE_TAG}"
          echo "║  Commit:    ${GITHUB_SHA:-local}"
          echo '╠══════════════════════════════════════════════════════════╣'
          echo "║  Public entry (nginx):  http://${SERVER_IP}/"
          echo "║    └─ Customer:         http://${SERVER_IP}/"
          echo "║    └─ Seller:           http://${SERVER_IP}/seller/"
          echo "║    └─ Admin:            http://${SERVER_IP}/admin/"
          echo "║    └─ API Gateway:      http://${SERVER_IP}/api/"
          echo "║  Eureka (internal):     http://${SERVER_IP}:8761"
          echo "║  (API gateway no longer published on :8080 — routed via nginx)"
          echo '╚══════════════════════════════════════════════════════════╝'
          log_ok "Deployment complete!"

          DEPLOY_EOF

          chmod +x /tmp/deploy.sh

          # Upload compose files and nginx config to the server
          scp -o StrictHostKeyChecking=no \
             -o UserKnownHostsFile=~/.ssh/known_hosts \
             -i ~/.ssh/id_rsa \
             -r \
             docker-compose.yml \
             docker-compose.prod-pulled.yml \
             nginx/ \
             "${SERVER}:/opt/flashsale/"

          scp -o StrictHostKeyChecking=no \
             -o UserKnownHostsFile=~/.ssh/known_hosts \
             -i ~/.ssh/id_rsa \
             /tmp/deploy.sh "${SERVER}:/tmp/deploy.sh"

          ssh -o StrictHostKeyChecking=no \
             -o UserKnownHostsFile=~/.ssh/known_hosts \
             -i ~/.ssh/id_rsa \
             "${SERVER}" \
             "IMAGE_PREFIX='${IMAGE_PREFIX}' GITHUB_TOKEN='${GITHUB_TOKEN}' JWT_SECRET='${JWT_SECRET}' REDIS_PASSWORD='${REDIS_PASSWORD}' POSTGRES_PASSWORD='${POSTGRES_PASSWORD}' MONGO_INITDB_ROOT_PASSWORD='${MONGO_INITDB_ROOT_PASSWORD}' MINIO_ACCESS_KEY='${MINIO_ACCESS_KEY}' MINIO_SECRET_KEY='${MINIO_SECRET_KEY}' STRIPE_SECRET_KEY='${STRIPE_SECRET_KEY}' STRIPE_WEBHOOK_SECRET_PROD='${STRIPE_WEBHOOK_SECRET_PROD}' VITE_STRIPE_PUBLISHABLE_KEY='${VITE_STRIPE_PUBLISHABLE_KEY}' STRIPE_PUBLISHABLE_KEY='${STRIPE_PUBLISHABLE_KEY}' MAIL_PASSWORD='${MAIL_PASSWORD}' MAIL_FROM='no-reply@flashsale.com' GITHUB_SHA='${{ github.sha }}' bash /tmp/deploy.sh '${IMAGE_TAG}' '${IMAGE_PREFIX}' '${REGISTRY}' '${_IP}'"

      - name: Final health check
        if: env.SKIP_DEPLOY != 'true'
        env:
          _IP: ${{ secrets.SERVER_IP }}
          _USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo ""
          echo "═══ Final health check ═══"
          sleep 10
          # Gateway is no longer published on host port 8080; check via SSH +
          # docker exec into the running container instead. Public traffic now
          # reaches the gateway via nginx (port 80) → upstream fs-gateway:8080.
          if ssh -o StrictHostKeyChecking=no ${_USER}@${_IP} \
              "docker exec fs-gateway curl -sf --max-time 5 http://localhost:8080/actuator/health" \
              > /dev/null 2>&1; then
            echo "[OK]  API Gateway healthy (via container exec)"
          else
            echo "[!!] API Gateway not yet responding (may still be starting)"
            echo "     Check server logs: ssh ${_USER}@${_IP}"
            echo "     Logs: cd /opt/flashsale && docker-compose logs --tail=50 api-gateway"
          fi
          # Also verify nginx is actually serving (since it now fronts the gateway)
          if curl -sf --connect-timeout 10 http://${_IP}/health > /dev/null 2>&1; then
            echo "[OK]  Reverse-proxy responding on port 80"
          else
            echo "[!!] Reverse-proxy not responding on port 80"
          fi

      - name: Deployment skipped
        if: env.SKIP_DEPLOY == 'true'
        run: |
          echo "──────────────────────────────────────────────"
          echo "  SERVER DEPLOY SKIPPED"
          echo "  Reason: ${{ env.SKIP_REASON }}"
          echo "────────────────────────────────────────────--"
          echo ""
          echo "Images were built and pushed to GHCR successfully."
          echo "To enable server deployment, add these secrets in"
          echo "GitHub → Settings → Secrets and variables → Actions:"
          echo ""
          echo "  DEPLOY_USER       (e.g. root, ubuntu)"
          echo "  SERVER_IP         (e.g. 1.2.3.4)"
          echo "  SSH_PRIVATE_KEY   (Paste your private key)"
          echo ""
          echo "  # Secrets (for production .env):"
          echo "  JWT_SECRET             (256-bit random string, base64)"
          echo "  POSTGRES_PASSWORD      (strong DB password)"
          echo "  REDIS_PASSWORD         (strong Redis password)"
          echo "  MONGO_INITDB_ROOT_PASSWORD (strong MongoDB password)"
          echo "  MINIO_ACCESS_KEY       (MinIO access key)"
          echo "  MINIO_SECRET_KEY       (MinIO secret key)"
          echo "  STRIPE_SECRET_KEY      (sk_live_xxx)"
          echo "  VITE_STRIPE_PUBLISHABLE_KEY  (pk_live_xxx — frontend build)"
          echo "  STRIPE_WEBHOOK_SECRET_PROD  (whsec_xxx from Dashboard)"
          echo "  MAIL_PASSWORD          (SendGrid API key)"
          echo ""

      - name: Deployment summary
        if: env.SKIP_DEPLOY != 'true'
        env:
          _IP: ${{ secrets.SERVER_IP }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo "             DEPLOYMENT SUMMARY"
          echo "══════════════════════════════════════════════════════════"
          echo "  Server:    ${_IP}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Image Tag: prod-latest"
          echo ""
          echo "  Services (all routed via nginx on port 80):"
          echo "    Customer     http://${_IP}/"
          echo "    Seller       http://${_IP}/seller/"
          echo "    Admin        http://${_IP}/admin/"
          echo "    API Gateway  http://${_IP}/api/"
          echo "    Eureka       http://${_IP}:8761  (internal only)"
          echo "══════════════════════════════════════════════════════════"
          echo ""
