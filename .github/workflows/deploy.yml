name: Build & Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'main'
  workflow_call:
    secrets:
      DEPLOY_USER:
        required: false
      SERVER_IP:
        required: false
      SSH_PRIVATE_KEY:
        required: false

env:
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  SERVER_IP: ${{ secrets.SERVER_IP }}

jobs:
  quick-validation:
    name: Validate Structure
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_call'
    steps:
      - uses: actions/checkout@v4
      - name: Validate backend structure
        run: |
          test -f backend/pom.xml || { echo "Missing backend/pom.xml"; exit 1; }
          for svc in discovery-service api-gateway identity-service product-service \
                     order-service payment-service flashsale-service \
                     search-service notification-service worker-service; do
            test -f "backend/$svc/pom.xml" || { echo "Missing backend/$svc/pom.xml"; exit 1; }
          done
          echo "All backend POMs found"
      - name: Validate frontend structure
        run: |
          for app in customer seller admin; do
            test -d "frontend/apps/$app/src" || { echo "Missing frontend/apps/$app/src"; exit 1; }
          done
          echo "All frontend apps found"
      - name: Validate docker-compose
        run: |
          test -f docker-compose.yml || { echo "Missing docker-compose.yml"; exit 1; }
          test -f docker-compose-backend.yml || { echo "Missing docker-compose-backend.yml"; exit 1; }
          echo "Docker compose files found"

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-server
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SSH key
        env:
          _USER: ${{ secrets.DEPLOY_USER }}
          _IP: ${{ secrets.SERVER_IP }}
          _KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$_USER" ] || [ -z "$_IP" ] || [ -z "$_KEY" ]; then
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
            echo "SKIP_REASON=Missing secrets (DEPLOY_USER, SERVER_IP, or SSH_PRIVATE_KEY)" >> $GITHUB_ENV
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$_KEY" > ~/.ssh/id_rsa
          sed -i 's/\r$//' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to server
        if: env.SKIP_DEPLOY != 'true'
        env:
          _USER: ${{ secrets.DEPLOY_USER }}
          _IP: ${{ secrets.SERVER_IP }}
          _REF: ${{ github.ref_name }}
          _SHA: ${{ github.sha }}
        run: |
          SERVER="${_USER}@${_IP}"
          echo "═══════════════════════════════════════════════════"
          echo "  Deploying to ${SERVER}"
          echo "  Branch: ${_REF}"
          echo "  Commit: ${_SHA}"
          echo "═══════════════════════════════════════════════════"

          cat > /tmp/deploy.sh << 'DEPLOY_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          
          RED='\033[0;31m'; GREEN='\033[0;32m'; YELLOW='\033[1;33m'
          BLUE='\033[0;34m'; NC='\033[0m'
          
          log_info() { echo -e "${BLUE}[INFO]${NC}  $*"; }
          log_ok()   { echo -e "${GREEN}[OK]${NC}   $*"; }
          log_warn() { echo -e "${YELLOW}[WARN]${NC} $*" >&2; }
          log_err()  { echo -e "${RED}[ERR]${NC}  $*" >&2; exit 1; }
          
          DEPLOY_USER="$1"; SERVER_IP="$2"; REF_NAME="$3"; SHA="$4"
          SERVER="${DEPLOY_USER}@${SERVER_IP}"
          PROJECT_DIR="/opt/flashsale"

          log_info "Connecting to ${SERVER}"

          # Step 1: Locate project directory
          LOCATE=$(ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no "${SERVER}" '
            if [ -d "'"${PROJECT_DIR}"'/.git" ]; then
              echo "'"${PROJECT_DIR}"'"
            elif [ -d "'"${PROJECT_DIR}"'/stealing-from-paradise/.git" ]; then
              echo "'"${PROJECT_DIR}"'/stealing-from-paradise"
            else
              echo "NOT_FOUND"
            fi
          ')
          [ "$LOCATE" = "NOT_FOUND" ] && log_err "Git repo not found on server at ${PROJECT_DIR}"
          log_ok "Project directory: ${LOCATE}"

          # Step 2: Git pull
          log_info "Pulling latest code (${REF_NAME})..."
          ssh -o StrictHostKeyChecking=no "${SERVER}" "
            set -e
            cd '${LOCATE}'
            git fetch --all --tags --quiet
            git checkout '${REF_NAME}' --quiet
            git reset --hard '${SHA}'
            git clean -fdx -e .env
          "
          log_ok "Code updated to ${SHA}"

          # Step 3: Ensure .env exists
          ssh -o StrictHostKeyChecking=no "${SERVER}" "
            if [ ! -f '${LOCATE}/.env' ]; then
              if [ -f '${LOCATE}/.env.example' ]; then
                cp '${LOCATE}/.env.example' '${LOCATE}/.env'
                log_warn 'Created .env from .env.example — update values before next deploy!'
              fi
            fi
          "
          log_ok ".env verified"

          # Step 4: Stop old services
          log_info "Stopping current services..."
          ssh -o StrictHostKeyChecking=no "${SERVER}" "
            set -e
            cd '${LOCATE}'
            docker compose -f docker-compose.yml -f docker-compose-backend.yml down --remove-orphans 2>/dev/null || true
            for c in fs-postgres fs-mongo fs-redis fs-elasticsearch fs-minio \
                      fs-zookeeper fs-kafka fs-kafka-init fs-axonserver \
                      fs-discovery fs-gateway fs-identity fs-payment fs-order \
                      fs-product fs-flashsale fs-search fs-notification fs-worker \
                      fs-customer-fe fs-seller-fe fs-admin-fe; do
              docker stop \"\$c\" 2>/dev/null && docker rm \"\$c\" 2>/dev/null || true
            done
            docker image prune -f >/dev/null 2>&1 || true
          "
          log_ok "Old services stopped"

          # Step 5: Build backend
          log_info "Building backend with Maven..."
          ssh -o StrictHostKeyChecking=no "${SERVER}" "
            set -e
            cd '${LOCATE}/backend'
            mvn clean package -DskipTests -q
          "
          log_ok "Backend JARs built"

          # Step 6: Build backend Docker images
          log_info "Building backend Docker images..."
          ssh -o StrictHostKeyChecking=no "${SERVER}" "
            set -e
            cd '${LOCATE}'
            for svc in discovery-service api-gateway identity-service product-service \
                       order-service payment-service flashsale-service \
                       search-service notification-service worker-service; do
              svc_dir=\"backend/\${svc}\"
              if [ ! -f \"\${svc_dir}/Dockerfile.prod\" ]; then
                log_warn \"Skipping \${svc} — no Dockerfile.prod\"
                continue
              fi
              if [ ! -d \"\${svc_dir}/target\" ]; then
                log_err \"\${svc} target/ not found — Maven build failed\"
              fi
              echo \"Building flashsale-\${svc}:latest\"
              docker build --platform linux/amd64 \
                -t flashsale-\${svc}:latest \
                -f \"\${svc_dir}/Dockerfile.prod\" \
                \"backend\"
              log_ok \"flashsale-\${svc}:latest built\"
            done
          "
          log_ok "All backend images built"

          # Step 7: Build frontend Docker images
          log_info "Building frontend Docker images..."
          ssh -o StrictHostKeyChecking=no "${SERVER}" "
            set -e
            cd '${LOCATE}'
            for app in customer seller admin; do
              dockerfile=\"frontend/apps/\${app}/Dockerfile.prod\"
              if [ ! -f \"\$dockerfile\" ]; then
                log_warn \"Skipping \${app} — no Dockerfile.prod\"
                continue
              fi
              echo \"Building flashsale-\${app}-app:latest\"
              docker build --platform linux/amd64 \
                -t flashsale-\${app}-app:latest \
                -f \"\$dockerfile\" \
                \"frontend\"
              log_ok \"flashsale-\${app}-app:latest built\"
            done
          "
          log_ok "All frontend images built"

          # Step 8: Start services
          log_info "Starting services..."
          ssh -o StrictHostKeyChecking=no "${SERVER}" "
            set -e
            cd '${LOCATE}'
            docker compose -f docker-compose.yml -f docker-compose-backend.yml up -d
          "
          log_ok "Services started"

          # Step 9: Health check
          log_info "Waiting for services to stabilize (60s)..."
          ssh -o StrictHostKeyChecking=no "${SERVER}" "
            set -e
            sleep 60
            echo 'Running containers:'
            docker compose -f '${LOCATE}/docker-compose.yml' ps
            echo ''
            echo 'Health checks:'
            curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1 && echo '[OK] API Gateway' || echo '[!!] API Gateway not ready'
            curl -sf http://localhost:8761/actuator/health > /dev/null 2>&1 && echo '[OK] Eureka' || echo '[!!] Eureka not ready'
          "
          log_ok "Health check complete"

          # Step 10: Summary
          ssh -o StrictHostKeyChecking=no "${SERVER}" "
            echo ''
            echo '╔══════════════════════════════════════════════════════════╗'
            echo '║          ✓  DEPLOYMENT SUCCESSFUL                    ║'
            echo '╠══════════════════════════════════════════════════════════╣'
            echo '║  Server:       '"${SERVER_IP}"'
            echo '║  Branch:       '"${REF_NAME}"'
            echo '║  Commit:       '"${SHA}"'
            echo '╠══════════════════════════════════════════════════════════╣'
            echo '║  API Gateway:  http://'"${SERVER_IP}"':8080'
            echo '║  Customer:     http://'"${SERVER_IP}"':3000'
            echo '║  Seller:       http://'"${SERVER_IP}"':3001'
            echo '║  Admin:        http://'"${SERVER_IP}"':3002'
            echo '║  Eureka:       http://'"${SERVER_IP}"':8761'
            echo '║  Swagger:      http://'"${SERVER_IP}"':8080/swagger-ui.html'
            echo '╚══════════════════════════════════════════════════════════╝'
          "
          log_ok "Deployment complete!"

          DEPLOY_EOF

          chmod +x /tmp/deploy.sh

          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=10 \
            /tmp/deploy.sh "${SERVER}:/tmp/deploy.sh"

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=10 \
            "${SERVER}" "bash /tmp/deploy.sh '${_USER}' '${_IP}' '${_REF}' '${_SHA}'"

      - name: Final health check
        if: env.SKIP_DEPLOY != 'true'
        env:
          _IP: ${{ secrets.SERVER_IP }}
          _USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo ""
          echo "═══ Final health check ═══"
          sleep 10
          if curl -sf --connect-timeout 10 http://${_IP}:8080/actuator/health > /dev/null 2>&1; then
            echo "[OK]  API Gateway responding on port 8080"
          else
            echo "[!!] API Gateway not yet responding (may still be starting)"
            echo "     Check server logs: ssh ${_USER}@${_IP}"
            echo "     Logs: cd /opt/flashsale && docker compose logs --tail=50"
          fi

      - name: Deployment skipped
        if: env.SKIP_DEPLOY == 'true'
        run: |
          echo "──────────────────────────────────────────────"
          echo "  DEPLOY SKIPPED"
          echo "  Reason: ${{ env.SKIP_REASON }}"
          echo "────────────────────────────────────────────--"
          echo ""
          echo "To enable deployment, add these secrets in"
          echo "GitHub → Settings → Secrets and variables → Actions:"
          echo ""
          echo "  DEPLOY_USER       (e.g. root, ubuntu)"
          echo "  SERVER_IP         (e.g. 1.2.3.4)"
          echo "  SSH_PRIVATE_KEY   (Paste your private key)"
          echo ""
          echo "Once configured, re-run this workflow."
          echo ""

      - name: Deployment summary
        if: env.SKIP_DEPLOY != 'true'
        env:
          _IP: ${{ secrets.SERVER_IP }}
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo "             DEPLOYMENT SUMMARY"
          echo "══════════════════════════════════════════════════════════"
          echo "  Server:    ${_IP}"
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Commit:    ${{ github.sha }}"
          echo ""
          echo "  Services:"
          echo "    API Gateway  http://${_IP}:8080"
          echo "    Customer     http://${_IP}:3000"
          echo "    Seller       http://${_IP}:3001"
          echo "    Admin        http://${_IP}:3002"
          echo "    Eureka       http://${_IP}:8761"
          echo "    Swagger      http://${_IP}:8080/swagger-ui.html"
          echo "══════════════════════════════════════════════════════════"
          echo ""
