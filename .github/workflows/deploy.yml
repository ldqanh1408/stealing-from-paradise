name: CD — Deploy to Production

on:
  # Triggered when a PR is merged (closed with merged=true)
  pull_request:
    types: [closed]
    branches:
      - main
  # Triggered on direct push to main (e.g. bypassing PR, hotfix)
  push:
    branches:
      - main
  # Manual trigger
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'main'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/flashsale

jobs:
  # ─────────────────────────────────────────────
  # 0. Gate: skip non-merge PR closes
  # ─────────────────────────────────────────────
  gate:
    name: Gate Check
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" == "closed" ]]; then
            if [[ "${{ github.event.pull_request.merged }}" != "true" ]]; then
              echo "should_run=false" >> $GITHUB_OUTPUT
              echo "reason=PR closed without merge — skipping CD"
            else
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "reason=PR merged to main — proceeding with CD"
            fi
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "reason=Push to main or manual dispatch — proceeding with CD"
          fi

  # ─────────────────────────────────────────────
  # 1. Build Backend Prod Images (Dockerfile.prod)
  # ─────────────────────────────────────────────
  build-backend:
    name: Prod - Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_run == 'true'

    strategy:
      fail-fast: false
      matrix:
        service: [
          api-gateway,
          discovery-service,
          identity-service,
          product-service,
          order-service,
          payment-service,
          flashsale-service,
          search-service,
          notification-service,
          worker-service,
        ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} prod image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/${{ matrix.service }}/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:prod-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # 2. Build Frontend Prod Images (Dockerfile.prod)
  # ─────────────────────────────────────────────
  build-frontend:
    name: Prod - Build ${{ matrix.app }}-app
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_run == 'true'

    strategy:
      fail-fast: false
      matrix:
        app: [customer, seller, admin]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }} prod image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/apps/${{ matrix.app }}/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}-app:prod-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}-app:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # 3. Deploy to Server — pull images and start
  # ─────────────────────────────────────────────
  deploy-server:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, gate]
    if: needs.gate.outputs.should_run == 'true'
    concurrency:
      group: deploy-server
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            docker-compose-backend.yml
            docker-compose-infrastructure.yml
            backend/docker-compose.prod.yml
            backend/docker-compose.prod-pulled.yml
            frontend/docker-compose.prod-pulled.yml
            .env.example
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Set image tag
        id: meta
        run: |
          echo "tag=prod-latest" >> $GITHUB_OUTPUT

      - name: Install SSH key
        env:
          _USER: ${{ secrets.DEPLOY_USER }}
          _IP: ${{ secrets.SERVER_IP }}
          _KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$_USER" ] || [ -z "$_IP" ] || [ -z "$_KEY" ]; then
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
            echo "SKIP_REASON=Missing secrets (DEPLOY_USER, SERVER_IP, or SSH_PRIVATE_KEY)" >> $GITHUB_ENV
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$_KEY" > ~/.ssh/id_rsa
          sed -i 's/\r$//' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Debug SSH Connection
        if: env.SKIP_DEPLOY != 'true'
        env:
          _USER: ${{ secrets.DEPLOY_USER }}
          _IP: ${{ secrets.SERVER_IP }}
        run: |
          SERVER="${_USER}@${_IP}"
          echo "Testing SSH to ${SERVER}..."
          ssh -o StrictHostKeyChecking=no \
             -o UserKnownHostsFile=~/.ssh/known_hosts \
             -o ConnectTimeout=15 \
             "${SERVER}" "echo 'SSH OK' && uname -a"

      - name: Deploy to server
        if: env.SKIP_DEPLOY != 'true'
        env:
          _USER: ${{ secrets.DEPLOY_USER }}
          _IP: ${{ secrets.SERVER_IP }}
          IMAGE_TAG: prod-latest
          IMAGE_PREFIX: ${{ github.repository_owner }}/flashsale
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SERVER="${_USER}@${_IP}"
          echo "═══════════════════════════════════════════════════"
          echo "  Deploying to ${SERVER}"
          echo "  Tag: ${IMAGE_TAG}"
          echo "  Registry: ${REGISTRY}"
          echo "═══════════════════════════════════════════════════"

          cat > /tmp/deploy.sh << 'DEPLOY_EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          RED='\033[0;31m'; GREEN='\033[0;32m'; YELLOW='\033[1;33m'
          BLUE='\033[0;34m'; NC='\033[0m'

          log_info() { echo -e "${BLUE}[INFO]${NC}  $*"; }
          log_ok()   { echo -e "${GREEN}[OK]${NC}   $*"; }
          log_warn() { echo -e "${YELLOW}[WARN]${NC} $*" >&2; }
          log_err()  { echo -e "${RED}[ERR]${NC}  $*" >&2; exit 1; }

          IMAGE_TAG="${1}"; IMAGE_PREFIX="${2}"; REGISTRY="${3}"; SERVER_IP="${4}"
          PROJECT_DIR="/opt/flashsale"

          log_info "Starting server deployment"
          log_info "Image tag: ${IMAGE_TAG}"

          # Step 1: Login to GHCR
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            log_info "Logging into ${REGISTRY}..."
            echo "${GITHUB_TOKEN}" | docker login "${REGISTRY}" -u USERNAME --password-stdin
            log_ok "Registry login OK"
          fi

          # Step 2: Stop old services
          log_info "Stopping current services..."
          cd "${PROJECT_DIR}"
          docker-compose -f docker-compose.yml -f docker-compose-backend.yml down --remove-orphans 2>/dev/null || true
          for c in fs-postgres fs-mongo fs-redis fs-elasticsearch fs-minio \
                    fs-zookeeper fs-kafka fs-kafka-init fs-axonserver \
                    fs-discovery fs-gateway fs-identity fs-payment fs-order \
                    fs-product fs-flashsale fs-search fs-notification fs-worker \
                    fs-customer-fe fs-seller-fe fs-admin-fe; do
            docker stop "$c" 2>/dev/null && docker rm "$c" 2>/dev/null || true
          done
          docker image prune -f >/dev/null 2>&1 || true
          log_ok "Old services stopped"

          # Step 3: Pull backend images
          log_info "Pulling backend images..."
          BACKEND_SVCS=(
            "discovery-service" "api-gateway" "identity-service" "product-service"
            "order-service" "payment-service" "flashsale-service"
            "search-service" "notification-service" "worker-service"
          )
          for svc in "${BACKEND_SVCS[@]}"; do
            IMG="${REGISTRY}/${IMAGE_PREFIX}-${svc}:${IMAGE_TAG}"
            echo "  Pulling ${IMG}"
            docker pull "${IMG}" || log_warn "Failed to pull ${IMG}"
          done

          # Step 4: Pull frontend images
          log_info "Pulling frontend images..."
          for app in customer seller admin; do
            IMG="${REGISTRY}/${IMAGE_PREFIX}-${app}-app:${IMAGE_TAG}"
            echo "  Pulling ${IMG}"
            docker pull "${IMG}" || log_warn "Failed to pull ${IMG}"
          done

          # Step 5: Tag images as prod-latest for docker-compose (local alias)
          log_info "Tagging images..."
          for svc in "${BACKEND_SVCS[@]}"; do
            docker tag "${REGISTRY}/${IMAGE_PREFIX}-${svc}:${IMAGE_TAG}" \
                       "flashsale-${svc}:prod-latest" 2>/dev/null || true
          done
          for app in customer seller admin; do
            docker tag "${REGISTRY}/${IMAGE_PREFIX}-${app}-app:${IMAGE_TAG}" \
                       "flashsale-${app}-app:prod-latest" 2>/dev/null || true
          done
          log_ok "Images tagged"

          # Step 6: Start services using prod-pulled compose files
          log_info "Starting services..."
          cd "${PROJECT_DIR}"
          export IMAGE_PREFIX
          docker-compose \
            -f docker-compose.yml \
            -f docker-compose-backend.yml \
            -f backend/docker-compose.prod-pulled.yml \
            -f frontend/docker-compose.prod-pulled.yml \
            up -d
          log_ok "Services started"

          # Step 7: Health check
          log_info "Waiting for services to stabilize (60s)..."
          sleep 60
          echo 'Running containers:'
          docker-compose \
            -f docker-compose.yml \
            -f docker-compose-backend.yml \
            -f backend/docker-compose.prod-pulled.yml \
            -f frontend/docker-compose.prod-pulled.yml \
            ps
          echo ''
          echo 'Health checks:'
          curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1 && echo '[OK] API Gateway' || echo '[!!] API Gateway not ready'
          curl -sf http://localhost:8761/actuator/health > /dev/null 2>&1 && echo '[OK] Eureka' || echo '[!!] Eureka not ready'
          log_ok "Health check complete"

          # Step 8: Summary
          echo ''
          echo '╔══════════════════════════════════════════════════════════╗'
          echo '║          ✓  DEPLOYMENT SUCCESSFUL                    ║'
          echo '╠══════════════════════════════════════════════════════════╣'
          echo "║  Tag:       ${IMAGE_TAG}"
          echo "║  Commit:    ${COMMIT_SHA:-local}"
          echo '╠══════════════════════════════════════════════════════════╣'
          echo "║  API Gateway:  http://${SERVER_IP}:8080"
          echo "║  Customer:     http://${SERVER_IP}:3000"
          echo "║  Seller:       http://${SERVER_IP}:3001"
          echo "║  Admin:        http://${SERVER_IP}:3002"
          echo "║  Eureka:       http://${SERVER_IP}:8761"
          echo "║  Swagger:      http://${SERVER_IP}:8080/swagger-ui.html"
          echo '╚══════════════════════════════════════════════════════════╝'
          log_ok "Deployment complete!"

          DEPLOY_EOF

          chmod +x /tmp/deploy.sh

          # Upload compose files to the server
          scp -o StrictHostKeyChecking=no \
             -o UserKnownHostsFile=~/.ssh/known_hosts \
             -i ~/.ssh/id_rsa \
             docker-compose.yml \
             docker-compose-backend.yml \
             "${SERVER}:/opt/flashsale/"

          scp -o StrictHostKeyChecking=no \
             -o UserKnownHostsFile=~/.ssh/known_hosts \
             -i ~/.ssh/id_rsa \
             backend/docker-compose.prod-pulled.yml \
             "${SERVER}:/opt/flashsale/backend/"

          scp -o StrictHostKeyChecking=no \
             -o UserKnownHostsFile=~/.ssh/known_hosts \
             -i ~/.ssh/id_rsa \
             frontend/docker-compose.prod-pulled.yml \
             "${SERVER}:/opt/flashsale/frontend/"

          scp -o StrictHostKeyChecking=no \
             -o UserKnownHostsFile=~/.ssh/known_hosts \
             -i ~/.ssh/id_rsa \
             /tmp/deploy.sh "${SERVER}:/tmp/deploy.sh"

          ssh -o StrictHostKeyChecking=no \
             -o UserKnownHostsFile=~/.ssh/known_hosts \
             -i ~/.ssh/id_rsa \
             "${SERVER}" \
             "IMAGE_PREFIX='${IMAGE_PREFIX}' GITHUB_TOKEN='${GITHUB_TOKEN}' bash /tmp/deploy.sh '${IMAGE_TAG}' '${IMAGE_PREFIX}' '${REGISTRY}' '${_IP}'"

      - name: Final health check
        if: env.SKIP_DEPLOY != 'true'
        env:
          _IP: ${{ secrets.SERVER_IP }}
          _USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo ""
          echo "═══ Final health check ═══"
          sleep 10
          if curl -sf --connect-timeout 10 http://${_IP}:8080/actuator/health > /dev/null 2>&1; then
            echo "[OK]  API Gateway responding on port 8080"
          else
            echo "[!!] API Gateway not yet responding (may still be starting)"
            echo "     Check server logs: ssh ${_USER}@${_IP}"
            echo "     Logs: cd /opt/flashsale && docker compose logs --tail=50"
          fi

      - name: Deployment skipped
        if: env.SKIP_DEPLOY == 'true'
        run: |
          echo "──────────────────────────────────────────────"
          echo "  SERVER DEPLOY SKIPPED"
          echo "  Reason: ${{ env.SKIP_REASON }}"
          echo "────────────────────────────────────────────--"
          echo ""
          echo "Images were built and pushed to GHCR successfully."
          echo "To enable server deployment, add these secrets in"
          echo "GitHub → Settings → Secrets and variables → Actions:"
          echo ""
          echo "  DEPLOY_USER       (e.g. root, ubuntu)"
          echo "  SERVER_IP         (e.g. 1.2.3.4)"
          echo "  SSH_PRIVATE_KEY   (Paste your private key)"
          echo ""

      - name: Deployment summary
        if: env.SKIP_DEPLOY != 'true'
        env:
          _IP: ${{ secrets.SERVER_IP }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo "             DEPLOYMENT SUMMARY"
          echo "══════════════════════════════════════════════════════════"
          echo "  Server:    ${_IP}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Image Tag: prod-latest"
          echo ""
          echo "  Services:"
          echo "    API Gateway  http://${_IP}:8080"
          echo "    Customer     http://${_IP}:3000"
          echo "    Seller       http://${_IP}:3001"
          echo "    Admin        http://${_IP}:3002"
          echo "    Eureka       http://${_IP}:8761"
          echo "    Swagger      http://${_IP}:8080/swagger-ui.html"
          echo "══════════════════════════════════════════════════════════"
          echo ""
