openapi: 3.1.0
info:
  title: Identity Service API
  description: >
    Central authentication and user management API for the FlashSale marketplace platform.
    Handles JWT token generation/validation, user registration and login, role-based access
    control (BUYER/SELLER/ADMIN), address management, token blacklisting, avatar presigned
    URLs, and admin account controls. Internal endpoints provide inter-service user lookups.
  version: 5.4.0
  contact:
    name: FlashSale Platform Team

servers:
  - url: http://localhost:8081/api/v1
    description: Local development (Identity Service direct)
  - url: https://api.marketplace.vn/api/v1
    description: Production (via API Gateway)

tags:
  - name: Authentication
    description: Login, registration, token refresh, and logout
  - name: User Profile
    description: User profile management and avatar uploads
  - name: Addresses
    description: Shipping address CRUD
  - name: Admin
    description: Admin-only account locking/unlocking
  - name: Internal
    description: Inter-service user lookup endpoints

security:
  - bearerAuth: []

paths:
  # =========================================================================
  # Authentication
  # =========================================================================
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new buyer account
      description: Creates a new user with BUYER role. Validates uniqueness of username, email, and phone.
      operationId: registerBuyer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Username, email, or phone already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/register/seller:
    post:
      tags: [Authentication]
      summary: Register a new seller account
      description: Creates a new user with SELLER role. Same validation as buyer registration.
      operationId: registerSeller
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Seller account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Username, email, or phone already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and receive JWT tokens
      description: >
        Authenticates using credential (username, email, or phone) and password.
        Returns JWT access token (short-lived) and refresh token (long-lived).
        Domain-based role routing is supported for multi-tenant subdomain deployments.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Account is locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLockedError'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Generates a new access token pair using a valid refresh token. Implements refresh token rotation.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: The refresh token from a previous login/refresh response
                  example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '401':
          description: Refresh token expired or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout and revoke tokens
      description: >
        Blacklists the current JWT access token in Redis with TTL matching remaining token
        lifetime. If refresh_token is provided, also revokes the refresh token.
      operationId: logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Optional refresh token to also revoke
                logout_all_devices:
                  type: boolean
                  default: false
                  description: If true, revoke all tokens for this user
      responses:
        '200':
          description: Logout successful, token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logout successful, current token has been revoked"
        '401':
          description: Token is invalid or already expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # =========================================================================
  # User Profile
  # =========================================================================
  /users/me:
    get:
      tags: [User Profile]
      summary: Get current user profile
      operationId: getCurrentUser
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
    put:
      tags: [User Profile]
      summary: Update user profile
      description: Updates fullName and/or phone for the authenticated user.
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: "Nguyen Van A"
                phone:
                  type: string
                  pattern: '^(0|\+84)[3|5|7|8|9][0-9]{8}$'
                  description: Vietnamese phone number format
                  example: "0901234567"
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Phone number already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users/me/avatar/presigned-url:
    get:
      tags: [User Profile]
      summary: Get presigned URL for avatar upload
      description: >
        Generates a MinIO presigned PUT URL for direct avatar image upload.
        URL is valid for 15 minutes. Bucket: user-avatars.
      operationId: getAvatarPresignedUrl
      parameters:
        - name: content_type
          in: query
          required: true
          schema:
            type: string
            enum: [image/jpeg, image/png, image/webp]
          description: MIME type of the image to upload
      responses:
        '200':
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /users/me/change-password:
    post:
      tags: [User Profile]
      summary: Change password
      description: Changes the authenticated user's password. Requires current password verification.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                  minLength: 1
                  example: "OldPass123!"
                new_password:
                  type: string
                  minLength: 8
                  description: Must contain at least 1 uppercase and 1 digit
                  example: "NewPass456!"
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password changed successfully"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users/me/roles/seller:
    post:
      tags: [User Profile]
      summary: Upgrade buyer to seller role
      description: Allows a BUYER to self-upgrade to SELLER role.
      operationId: upgradeToSeller
      responses:
        '200':
          description: Role upgraded to SELLER
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Successfully upgraded to SELLER"

  # =========================================================================
  # Addresses
  # =========================================================================
  /users/me/addresses:
    get:
      tags: [Addresses]
      summary: List user addresses
      description: Returns all shipping addresses for the authenticated user. Default address first.
      operationId: listAddresses
      responses:
        '200':
          description: Address list retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressResponse'
    post:
      tags: [Addresses]
      summary: Add a new address
      description: Creates a new shipping address. If is_default is true, existing default is demoted.
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /users/me/addresses/{addressId}:
    put:
      tags: [Addresses]
      summary: Update an address
      description: Updates address fields. Setting is_default to true promotes this address to default.
      operationId: updateAddress
      parameters:
        - $ref: '#/components/parameters/AddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdateRequest'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '404':
          description: Address not found or does not belong to user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [Addresses]
      summary: Delete an address
      description: >
        Deletes an address. Cannot delete the only default address; promote another
        address to default first.
      operationId: deleteAddress
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '200':
          description: Address deleted
        '400':
          description: Cannot delete the only default address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # =========================================================================
  # Admin
  # =========================================================================
  /admin/users/{userId}/lock:
    post:
      tags: [Admin]
      summary: Lock a user account
      description: Admin endpoint to lock a user account with reason tracking.
      operationId: lockUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
                  example: "Violation of marketplace terms"
      responses:
        '200':
          description: Account locked
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/users/{userId}/unlock:
    post:
      tags: [Admin]
      summary: Unlock a user account
      description: Admin endpoint to unlock a previously locked user account.
      operationId: unlockUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Account unlocked
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # =========================================================================
  # Internal (Inter-service)
  # =========================================================================
  /internal/users/{userId}/role:
    get:
      tags: [Internal]
      summary: Get user role (internal)
      description: Internal endpoint for inter-service role lookup. Returns role name and active status.
      operationId: getUserRoleInternal
      security: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User role retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  role_name:
                    type: string
                    enum: [BUYER, SELLER, ADMIN]
                  active:
                    type: boolean
                  user_id:
                    type: integer
                    format: int64

  /internal/users/{userId}:
    get:
      tags: [Internal]
      summary: Get user info (internal)
      description: Internal endpoint for inter-service user info retrieval.
      operationId: getUserInfoInternal
      security: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User info retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalUserInfoResponse'

  /internal/users/exists:
    get:
      tags: [Internal]
      summary: Check if user exists (internal)
      description: Internal endpoint to check user existence by username, email, or phone.
      operationId: checkUserExistsInternal
      security: []
      parameters:
        - name: username
          in: query
          schema:
            type: string
          description: Username to check
        - name: email
          in: query
          schema:
            type: string
            format: email
          description: Email to check
        - name: phone
          in: query
          schema:
            type: string
          description: Phone to check
      responses:
        '200':
          description: Existence check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean

# =============================================================================
# Components
# =============================================================================
components:
  parameters:
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Address ID
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: User ID

  schemas:
    RegisterRequest:
      type: object
      required: [username, email, phone, password, full_name]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-z0-9._]+$'
          description: Unique username (lowercase, digits, dots, underscores)
          example: "nguyen_van_a"
        email:
          type: string
          format: email
          maxLength: 255
          description: Unique email address
          example: "a@example.com"
        phone:
          type: string
          pattern: '^(0|\+84)[3|5|7|8|9][0-9]{8}$'
          description: Unique Vietnamese phone number
          example: "0901234567"
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Must contain at least 1 uppercase letter and 1 digit
          example: "SecurePass123!"
        full_name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Nguyen Van A"

    LoginRequest:
      type: object
      required: [credential, password]
      properties:
        credential:
          type: string
          description: Username, email, or phone number
          example: "a@example.com"
        password:
          type: string
          minLength: 1
          example: "SecurePass123!"

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token (RS256, short-lived)
        refresh_token:
          type: string
          description: JWT refresh token (RS256, long-lived)
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token TTL in seconds (default 900)
        refresh_expires_in:
          type: integer
          description: Refresh token TTL in seconds (default 604800)
        user_id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        phone:
          type: string
        full_name:
          type: string
        status:
          type: string
          enum: [ACTIVE, LOCKED]
        created_at:
          type: string
          format: date-time

    TokenRefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer

    UserResponse:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        full_name:
          type: string
        status:
          type: string
          enum: [ACTIVE, LOCKED]
        created_at:
          type: string
          format: date-time

    UserProfileResponse:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        phone:
          type: string
        full_name:
          type: string
        status:
          type: string
          enum: [ACTIVE, LOCKED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PresignedUrlResponse:
      type: object
      properties:
        upload_url:
          type: string
          format: uri
          description: MinIO presigned PUT URL for direct upload
        object_key:
          type: string
          description: S3 object key path
        cdn_url:
          type: string
          format: uri
          description: CDN URL for the uploaded avatar
        expires_in:
          type: integer
          description: URL TTL in seconds (900)

    AddressCreateRequest:
      type: object
      required: [province_id, district_id, full_address]
      properties:
        province_id:
          type: integer
          example: 79
        district_id:
          type: integer
          example: 760
        full_address:
          type: string
          maxLength: 500
          example: "123 Nguyen Trai, Ward 2"
        is_default:
          type: boolean
          default: false

    AddressUpdateRequest:
      type: object
      properties:
        province_id:
          type: integer
        district_id:
          type: integer
        full_address:
          type: string
          maxLength: 500
        is_default:
          type: boolean

    AddressResponse:
      type: object
      properties:
        address_id:
          type: integer
          format: int64
        province_id:
          type: integer
        district_id:
          type: integer
        full_address:
          type: string
        is_default:
          type: boolean

    InternalUserInfoResponse:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        phone:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [BUYER, SELLER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, LOCKED]

    AccountLockedError:
      type: object
      properties:
        error:
          type: string
          example: "ACCOUNT_LOCKED"
        message:
          type: string
        status_code:
          type: integer
          example: 403

    ApiError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        status_code:
          type: integer

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (RS256). The API Gateway decodes the JWT and injects X-User-Id and X-User-Role headers.
