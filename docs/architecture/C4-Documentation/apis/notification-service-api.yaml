openapi: 3.1.0
info:
  title: Notification Service API
  description: >
    Real-time notification delivery API for the FlashSale marketplace platform.
    Built with Spring WebFlux (reactive) for Server-Sent Events (SSE) push
    notifications via Redis Pub/Sub with a 60-second buffer. Stores notification
    history in MongoDB with 90-day TTL auto-expiry. Supports SSE streaming
    connections, paginated notification history, read/unread tracking, and
    unread count queries. Consumes 20+ Kafka topics (order lifecycle, refund
    decisions, flash sale events, product moderation, account status, Stripe
    account changes, etc.) to generate and push notifications.
  version: 5.4.0
  contact:
    name: FlashSale Platform Team

servers:
  - url: http://localhost:8092/api/v1
    description: Local development (Notification Service direct)
  - url: https://api.marketplace.vn/api/v1
    description: Production (via API Gateway)

tags:
  - name: SSE Stream
    description: Real-time notification push via Server-Sent Events
  - name: Notifications
    description: Notification history and read state management

security:
  - bearerAuth: []

paths:
  /notifications/stream:
    get:
      tags: [SSE Stream]
      summary: Connect to real-time notification stream (SSE)
      description: >
        Opens a persistent Server-Sent Events (text/event-stream) connection for
        real-time notification delivery. The server pushes notifications as they
        occur via Redis Pub/Sub with a 60-second buffer. Use the EventSource API
        in the browser. Supports Last-Event-ID header for replaying missed events.

        Notification types include: ORDER_CREATED, ORDER_PAID, ORDER_SHIPPED,
        ORDER_DELIVERED, ORDER_CANCELLED, ORDER_AUTO_CANCELLED, REFUND_REQUESTED,
        REFUND_APPROVED, REFUND_REJECTED, FLASH_SALE_STARTING, FLASH_SALE_ENDED,
        FS_ITEM_APPROVED, FS_ITEM_REJECTED, PRODUCT_APPROVED, PRODUCT_REJECTED,
        ACCOUNT_LOCKED, ACCOUNT_UNLOCKED, STRIPE_ACCOUNT_SUSPENDED,
        SELLER_POSTING_SUSPENDED, SELLER_POSTING_RESUMED.
      operationId: streamNotifications
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: string
          description: ID of the last received event for replay support
      responses:
        '200':
          description: SSE stream connection established
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  SSE event stream. Each event has a `data:` line containing a JSON
                  notification object with id, type, title, body, metadata (including
                  deeplink for navigation), and created_at fields.

                  Example:
                  data: {"id":"64f3a","type":"REFUND_APPROVED","title":"Refund successful","body":"Your refund of 350,000 VND has been approved","metadata":{"deeplink":"/orders/100/refunds/88"},"created_at":"2026-04-15T10:00:00Z"}
              example: |
                data: {"id":"64f3a","type":"REFUND_APPROVED","title":"Refund successful","body":"Your refund of 350,000 VND has been approved","metadata":{"deeplink":"/orders/100/refunds/88"},"created_at":"2026-04-15T10:00:00Z"}

                data: {"id":"64f3b","type":"ORDER_SHIPPED","title":"Order shipped","body":"Tracking: VT123456789","metadata":{"deeplink":"/orders/100"},"created_at":"2026-04-15T10:05:00Z"}
        '401':
          description: Invalid or expired JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /notifications:
    get:
      tags: [Notifications]
      summary: List notification history
      description: >
        Returns paginated list of persisted notifications from MongoDB. Supports
        filtering by read/unread state.
      operationId: listNotifications
      parameters:
        - name: is_read
          in: query
          schema:
            type: boolean
          description: Filter by read state (true=read, false=unread)
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Page number (0-indexed)
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Results per page
      responses:
        '200':
          description: Notification history retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'

  /notifications/{notifId}/read:
    patch:
      tags: [Notifications]
      summary: Mark a notification as read
      description: Marks a single notification as read.
      operationId: markNotificationRead
      parameters:
        - $ref: '#/components/parameters/NotifId'
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  is_read:
                    type: boolean
                    enum: [true]

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all notifications as read
      description: Marks all unread notifications for the authenticated user as read.
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_count:
                    type: integer
                    description: Number of notifications updated
                    example: 5

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notification count
      description: Returns the count of unread notifications for the authenticated user.
      operationId: getUnreadCount
      responses:
        '200':
          description: Unread count retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_count:
                    type: integer
                    example: 5

# =============================================================================
# Components
# =============================================================================
components:
  parameters:
    NotifId:
      name: notifId
      in: path
      required: true
      schema:
        type: string
      description: Notification ID (MongoDB ObjectId as hex string)

  schemas:
    Notification:
      type: object
      properties:
        id:
          type: string
          description: Notification ID
          example: "64f3a"
        type:
          type: string
          description: >
            Notification type. One of: ORDER_CREATED, ORDER_PAID, ORDER_SHIPPED,
            ORDER_DELIVERED, ORDER_CANCELLED, ORDER_AUTO_CANCELLED, REFUND_REQUESTED,
            REFUND_APPROVED, REFUND_REJECTED, FLASH_SALE_STARTING, FLASH_SALE_ENDED,
            FS_ITEM_APPROVED, FS_ITEM_REJECTED, PRODUCT_APPROVED, PRODUCT_REJECTED,
            TRUST_SCORE_WARNING (removed in MVP), ACCOUNT_LOCKED, ACCOUNT_UNLOCKED,
            APPEAL_RESOLVED (removed in MVP), STRIPE_ACCOUNT_SUSPENDED,
            SELLER_POSTING_SUSPENDED, SELLER_POSTING_RESUMED
          example: "REFUND_APPROVED"
        title:
          type: string
          example: "Refund successful"
        body:
          type: string
          example: "Your refund of 350,000 VND has been approved"
        is_read:
          type: boolean
          description: Whether the user has read this notification
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
          description: Notification priority level
        metadata:
          type: object
          properties:
            deeplink:
              type: string
              description: Frontend navigation deeplink
              example: "/orders/100/refunds/88"
            refund_id:
              type: integer
              format: int64
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    NotificationPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        total_elements:
          type: integer
          example: 24
        page_number:
          type: integer
          example: 0
        page_size:
          type: integer
          example: 20

    ApiError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        status_code:
          type: integer

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (RS256). Required for all notification operations.
