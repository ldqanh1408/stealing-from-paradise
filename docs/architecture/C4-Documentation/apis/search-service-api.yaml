openapi: 3.1.0
info:
  title: Search Service API
  description: >
    Full-text product search API for the FlashSale marketplace platform. Powered by
    Elasticsearch with faceted filtering and aggregation. Supports keyword search
    across product names and descriptions, category filtering, price range filtering,
    stock availability toggle, flash sale filtering, sort options (relevance, price,
    newest, best-selling), and autocomplete suggestions. Consumes Kafka events
    (product.approved, product.updated, product.deleted, inventory.adjusted, etc.)
    to maintain real-time search index synchronization.
  version: 5.4.0
  contact:
    name: FlashSale Platform Team

servers:
  - url: http://localhost:8091/api/v1
    description: Local development (Search Service direct)
  - url: https://api.marketplace.vn/api/v1
    description: Production (via API Gateway)

tags:
  - name: Search
    description: Full-text product search with filtering
  - name: Suggestions
    description: Autocomplete search suggestions

paths:
  /search/products:
    get:
      tags: [Search]
      summary: Search products
      description: >
        Full-text product search with faceted filtering, price range, stock availability,
        flash sale filtering, and sort options. Returns paginated results with product
        details enriched from the Elasticsearch index.
      operationId: searchProducts
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Full-text search query
          example: "nike air t-shirt"
        - name: category_id
          in: query
          schema:
            type: string
          description: Filter by category ID (includes subcategories)
        - name: price_min
          in: query
          schema:
            type: number
            format: double
            minimum: 0
          description: Minimum price filter
          example: 100000
        - name: price_max
          in: query
          schema:
            type: number
            format: double
            minimum: 0
          description: Maximum price filter
          example: 500000
        - name: in_stock
          in: query
          schema:
            type: boolean
            default: true
          description: Only show products with available stock
        - name: is_flash
          in: query
          schema:
            type: boolean
          description: Only show products currently in flash sale
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, newest, sold_desc]
            default: relevance
          description: |
            Sort order:
            - relevance: By search score (default)
            - price_asc: Lowest price first
            - price_desc: Highest price first
            - newest: Most recently created
            - sold_desc: Best selling first
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Page number (0-indexed)
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Results per page
      responses:
        '200':
          description: Search results retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /search/products/suggest:
    get:
      tags: [Suggestions]
      summary: Autocomplete search suggestions
      description: >
        Returns search query suggestions as the user types. Provides up to 10
        suggestions based on indexed product names and popular search terms.
      operationId: suggestProducts
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Partial query string the user is typing
          example: "ao thun"
        - name: size
          in: query
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 10
          description: Number of suggestions to return
      responses:
        '200':
          description: Suggestions retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionsResponse'
        '400':
          description: Query too short (minimum 2 characters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

# =============================================================================
# Components
# =============================================================================
components:
  schemas:
    SearchProduct:
      type: object
      description: Product as it appears in search results
      properties:
        product_id:
          type: string
          description: MongoDB ObjectId as hex string
          example: "507f1f77bcf86cd799439012"
        name:
          type: string
          example: "Nike Air Men's T-Shirt"
        seller_id:
          type: integer
          format: int64
        seller_name:
          type: string
          example: "Shop Nike VN"
        category_id:
          type: string
        category_name:
          type: string
          example: "Men's T-Shirts"
        price_min:
          type: number
          format: double
          description: Minimum price across all variants
          example: 250000
        price_max:
          type: number
          format: double
          description: Maximum price across all variants
          example: 450000
        images:
          type: array
          items:
            type: string
            format: uri
          description: Product image CDN URLs
        stock_available:
          type: integer
          description: Total available stock across all variants
          example: 95
        is_flash:
          type: boolean
          description: Whether product is flagged for flash sale
        created_at:
          type: string
          format: date-time

    SearchResponse:
      type: object
      properties:
        total_results:
          type: integer
          description: Total number of matching products
          example: 156
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total_pages:
          type: integer
          example: 8
        products:
          type: array
          items:
            $ref: '#/components/schemas/SearchProduct'

    SuggestionsResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: string
          description: Suggested search queries
          example: ["ao thun nam", "ao thun nu cotton", "ao thun oversize"]

    ApiError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        status_code:
          type: integer
